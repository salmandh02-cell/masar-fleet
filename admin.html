<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة تحكم المنصة</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#0E5A44;--ink:#15201B;--muted:#5A6862;--line:#D6DDD9;--bg:#EEF1EF;--surface:#fff;--surface-2:#F6F8F7;--ok:#0E7A4F;--warn:#B54708;--bad:#B42318;--info:#175CD3}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif}
header{background:var(--acc);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font:600 19px "Readex Pro",sans-serif}
header small{opacity:.8}
header .who{display:flex;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
nav{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 12px;overflow-x:auto}
nav button{font:600 14px "IBM Plex Sans Arabic",sans-serif;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav .badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-inline-start:4px}
main{max-width:1240px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.kpi b{display:block;font:700 24px "Readex Pro",sans-serif}
.kpi span{color:var(--muted);font-size:13px}
.kpi.hot{border-color:#F4C7C3;background:#FFFBFA}.kpi.hot b{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel h3{margin:0;font:600 16px "Readex Pro",sans-serif}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar input,.bar select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:inherit}
.bar input[type=search]{flex:1;min-width:200px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;font-size:13px;color:var(--muted);background:var(--surface-2)}
td small{display:block;color:var(--muted);font-size:12px}
tr.click{cursor:pointer}tr.click:hover td{background:#F8FBF9}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.p-active,.p-paid{background:#DCFAE6;color:var(--ok)}.p-trial{background:#D1E9FF;color:var(--info)}.p-suspended,.p-rejected,.p-cancelled{background:#FEE4E2;color:var(--bad)}.p-expired,.p-unpaid{background:#FEF0C7;color:var(--warn)}.p-pending{background:#F4EBFF;color:#6941C6}.p-off{background:#EAECF0;color:#475467}
.btn{font:600 13px "IBM Plex Sans Arabic",sans-serif;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.bad{color:var(--bad);border-color:#F4C7C3}
.btn.lt{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn:disabled{opacity:.5}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--muted)}
.auth{max-width:400px;margin:60px auto;background:var(--surface);border-radius:16px;padding:24px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.auth h2{margin:0;font:600 19px "Readex Pro",sans-serif}
.auth label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.auth input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.auth .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:14px;cursor:pointer;padding:2px}
.err{color:var(--bad);font-size:14px;min-height:1em}.ok{color:var(--ok);font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#15201B;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:100}
#toast.on{opacity:1}
dialog{border:0;border-radius:14px;padding:0;width:min(480px,94vw)}
dialog::backdrop{background:rgba(16,24,20,.45)}
dialog form{padding:20px;display:grid;gap:12px}
dialog h3{margin:0;font:600 17px "Readex Pro",sans-serif}
dialog label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
dialog input,dialog select,dialog textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:inherit}
dialog .acts{justify-content:flex-start}
dialog .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog .sum{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:2px}
#file{position:fixed;inset:0;background:rgba(16,24,20,.45);z-index:40;display:flex;justify-content:flex-start}
#file .sheet{background:var(--bg);width:min(980px,100%);height:100%;overflow:auto;box-shadow:0 0 40px rgba(0,0,0,.25)}
#file .top{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
#file .top h2{margin:0;font:600 19px "Readex Pro",sans-serif}
#file .body{padding:16px 18px 40px;display:grid;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.sec h4{margin:0 0 10px;font:600 15px "Readex Pro",sans-serif;display:flex;justify-content:space-between;align-items:center;gap:8px}
dl.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 18px;margin:0}
dl.kv div{border-bottom:1px dashed var(--line);padding-bottom:6px}
dl.kv dt{font-size:12px;color:var(--muted)}dl.kv dd{margin:0;font-weight:500;word-break:break-word}
.mini{min-width:0}.mini th,.mini td{padding:7px 9px;font-size:14px}
.note{border-inline-start:3px solid var(--acc);padding:4px 10px;margin:6px 0}
.note small{color:var(--muted);display:block;font-size:12px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs2 button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 12px;cursor:pointer}
.tabs2 button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.roles{display:grid;gap:6px;font-size:13px;color:var(--muted);padding:12px 14px}
.roles b{color:var(--ink)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:14px}
.form-grid label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.form-grid input,.form-grid textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px}
@media (max-width:640px){header{padding:10px 14px}main{padding:14px 12px 30px}dialog .g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><h1>لوحة تحكم المنصة</h1><small>الشركات المشتركة والاشتراكات والفواتير</small></div><div class="who" id="who"></div></header>
<div id="authBox" class="auth" hidden></div>
<div id="app" hidden>
  <nav id="nav"></nav>
  <main>
    <section class="kpis" id="kpis"></section>
    <section class="panel" id="t-companies" hidden>
      <div class="bar">
        <input id="q" type="search" placeholder="بحث: اسم الشركة، السجل، الرقم الضريبي، المدينة، الإيميل، الجوال">
        <select id="fs"><option value="reqs" hidden>الطلبات</option><option value="all">كل الحالات</option><option value="pending">بانتظار الاعتماد</option><option value="rejected">مرفوضة</option><option value="active">مفعّلة</option><option value="trial">تجربة</option><option value="expired">منتهية</option><option value="suspended">موقوفة</option></select>
        <button class="btn" id="reload">تحديث</button>
      </div>
      <div class="tw"><table><thead><tr><th>الشركة</th><th>السجل / الضريبي</th><th>المدير والتواصل</th><th>المدينة</th><th>الحالة</th><th>السيارات</th><th>التسجيل</th><th>نهاية التجربة / الاشتراك</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
    <section class="panel" id="t-invoices" hidden>
      <div class="bar">
        <input id="iq" type="search" placeholder="بحث: رقم الفاتورة أو اسم الشركة">
        <select id="ifs"><option value="all">كل الفواتير</option><option value="unpaid">غير مدفوعة</option><option value="overdue">متأخرة</option><option value="paid">مدفوعة</option><option value="cancelled">ملغاة</option></select>
        <button class="btn pri" id="newInv" hidden>فاتورة جديدة</button>
      </div>
      <div class="tw"><table><thead><tr><th>رقم الفاتورة</th><th>الشركة</th><th>التاريخ</th><th>الفترة</th><th>الإجمالي</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="irows"></tbody></table></div>
    </section>
    <section class="panel" id="t-team" hidden>
      <div class="bar"><h3 style="flex:1">فريق المنصة</h3><button class="btn pri" id="addStaff">إضافة مستخدم</button></div>
      <div class="tw"><table><thead><tr><th>الاسم</th><th>الإيميل</th><th>الدور</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="srows"></tbody></table></div>
      <div class="roles" id="roleHelp"></div>
    </section>
    <section class="panel" id="t-settings" hidden>
      <div class="bar"><h3 style="flex:1">بيانات شركة النظام (تظهر في الفواتير) والأسعار</h3></div>
      <form id="setf"><div class="form-grid" id="setg"></div><div style="padding:0 14px 14px"><button class="btn pri">حفظ الإعدادات</button></div></form>
    </section>
  </main>
</div>
<div id="file" hidden><div class="sheet" id="sheet"></div></div>
<dialog id="dlg"><form method="dialog" id="df"></form></dialog>
<div id="toast"></div>
<script src="qr.js"></script>
<script type="module">
import { FIREBASE_CONFIG, SUPER_ADMIN_EMAIL, TRIAL_DAYS } from './config.js';
const FB = 'https://www.gstatic.com/firebasejs/10.12.2';
const [{ initializeApp }, A, F] = await Promise.all([import(`${FB}/firebase-app.js`), import(`${FB}/firebase-auth.js`), import(`${FB}/firebase-firestore.js`)]);
const app = initializeApp(FIREBASE_CONFIG); const auth = A.getAuth(app); const fs = F.getFirestore(app);
const SUPER = String(SUPER_ADMIN_EMAIL).toLowerCase();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2800); };
const today = () => new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10);
const addDays = (d, n) => new Date(Date.parse((d && d > today() ? d : today()) + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const addMonths = (d, n) => { const x = new Date(Date.parse(d + 'T00:00:00Z')); x.setUTCMonth(x.getUTCMonth() + n); x.setUTCDate(x.getUTCDate() - 1); return x.toISOString().slice(0, 10); };
const fmt = s => s ? String(s).slice(0, 10) : '—';
const money = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nowIso = () => new Date().toISOString();

/* ---------- الأدوار (تطابق platPerms في firestore.rules) ---------- */
const ROLES = {
  manager: ['مدير عام', 'كل شيء: اعتماد الشركات، الاشتراكات، الفواتير، تعديل البيانات، والاطلاع على بيانات الشركات التشغيلية'],
  accounts: ['مدير الحسابات', 'اعتماد الشركات، تفعيل وإيقاف الاشتراكات، الفواتير والتحصيل، تعديل البيانات'],
  accountant: ['محاسب', 'إصدار الفواتير وتسجيل الدفعات، والاطلاع على ملفات الشركات'],
  sales: ['مدير مبيعات', 'مراجعة طلبات التسجيل واعتمادها أو رفضها، تمديد التجربة، تعديل البيانات وسجل المتابعة'],
  support: ['دعم فني', 'الاطلاع على ملف الشركة وبياناتها التشغيلية (قراءة فقط) وتسجيل المتابعة'],
  viewer: ['مطّلع', 'عرض الشركات والفواتير فقط دون أي تعديل']
};
const PERMS = { manager: ['view', 'data', 'approve', 'status', 'trial', 'edit', 'note', 'invoices'], accounts: ['view', 'approve', 'status', 'trial', 'edit', 'note', 'invoices'],
  accountant: ['view', 'note', 'invoices'], sales: ['view', 'approve', 'trial', 'edit', 'note'], support: ['view', 'data', 'note'], viewer: ['view'] };
let ME = { email: '', super: false, role: '', name: '' };
const can = p => ME.super || (PERMS[ME.role] || []).includes(p);

/* ---------- الحقول ---------- */
const PF = [
  ['بيانات المنشأة', [['legalName', 'الاسم التجاري حسب السجل'], ['crNumber', 'رقم السجل التجاري'], ['unifiedNumber', 'الرقم الوطني الموحد'], ['vatNumber', 'الرقم الضريبي'], ['activity', 'النشاط'], ['fleetSize', 'عدد السيارات (تقديري)']]],
  ['العنوان الوطني', [['city', 'المدينة'], ['district', 'الحي'], ['street', 'الشارع'], ['buildingNo', 'رقم المبنى'], ['postalCode', 'الرمز البريدي'], ['additionalNo', 'الرقم الإضافي'], ['shortAddress', 'العنوان المختصر']]],
  ['التواصل', [['officialEmail', 'البريد الرسمي'], ['companyPhone', 'هاتف الشركة'], ['contactName', 'اسم المسؤول'], ['contactTitle', 'المسمى الوظيفي'], ['contactMobile', 'جوال المسؤول'], ['website', 'الموقع الإلكتروني']]]];
const LTR = new Set(['crNumber', 'unifiedNumber', 'vatNumber', 'buildingNo', 'postalCode', 'additionalNo', 'shortAddress', 'officialEmail', 'companyPhone', 'contactMobile', 'website', 'fleetSize']);
const DOCK = { cr: 'السجل التجاري', vat: 'شهادة ضريبة القيمة المضافة', address: 'شهادة العنوان الوطني', other: 'مستند آخر' };
const SET_F = [['sellerName', 'اسم شركة النظام (البائع)'], ['sellerNameEn', 'الاسم بالإنجليزية'], ['vatNumber', 'الرقم الضريبي'], ['crNumber', 'السجل التجاري'], ['address', 'العنوان'], ['phone', 'الهاتف'], ['email', 'البريد'],
  ['bankName', 'البنك'], ['iban', 'رقم الآيبان (IBAN)'], ['pricePerVehicle', 'سعر السيارة شهرياً (ريال، قبل الضريبة)'], ['minMonthly', 'الحد الأدنى الشهري (ريال)'], ['vatRate', 'نسبة الضريبة %'], ['invoiceNote', 'ملاحظة أسفل الفاتورة']];

/* ---------- الحالة ---------- */
const ST = { active: ['مفعّلة', 'p-active'], trial: ['تجربة', 'p-trial'], suspended: ['موقوفة', 'p-suspended'], expired: ['منتهية', 'p-expired'], pending: ['بانتظار الاعتماد', 'p-pending'], rejected: ['مرفوضة', 'p-rejected'] };
const IST = { unpaid: ['غير مدفوعة', 'p-unpaid'], paid: ['مدفوعة', 'p-paid'], cancelled: ['ملغاة', 'p-cancelled'], overdue: ['متأخرة', 'p-suspended'] };
const stOf = c => c.status === 'trial' && c.trialEnds && c.trialEnds < today() ? 'expired' : c.status === 'active' && c.paidUntil && c.paidUntil < today() ? 'expired' : (c.status || 'trial');
const istOf = i => i.status === 'unpaid' && i.dueDate && i.dueDate < today() ? 'overdue' : i.status;
const pill = (m, k) => { const [l, c] = m[k] || [k, '']; return `<span class="pill ${c}">${esc(l)}</span>`; };
const isOpen = c => ['pending', 'rejected'].includes(c.status);
let COS = [], INVS = [], STAFF = [], SET = {}, TAB = 'requests';

/* ---------- الدخول ---------- */
function authCard(html) { const b = $('#authBox'); b.innerHTML = html; b.hidden = false; $('#app').hidden = true; }
function showLogin(msg) {
  authCard(`<h2>دخول فريق المنصة</h2><form id="lf" style="display:grid;gap:12px">
    <label>البريد الإلكتروني<input id="le" type="email" dir="ltr" autocomplete="username" required></label>
    <label>كلمة المرور<input id="lp" type="password" dir="ltr" autocomplete="current-password" required></label>
    <div class="err" id="lerr">${esc(msg || '')}</div><button class="btn pri" style="padding:11px">دخول</button></form>
    <div class="row"><button class="lnk" id="l-new">أول مرة؟ أنشئ كلمة مرور</button><button class="lnk" id="l-rst">نسيت كلمة المرور</button></div>`);
  $('#lf').onsubmit = async e => { e.preventDefault(); $('#lerr').textContent = '';
    try { await A.signInWithEmailAndPassword(auth, $('#le').value.trim(), $('#lp').value); }
    catch (err) { $('#lerr').textContent = err.code === 'auth/too-many-requests' ? 'محاولات كثيرة، انتظر قليلاً' : 'الإيميل أو كلمة المرور غير صحيحة. إن كانت أول مرة فاختر «أنشئ كلمة مرور».'; } };
  $('#l-new').onclick = showCreate; $('#l-rst').onclick = showReset;
}
function showCreate() {
  authCard(`<h2>إنشاء كلمة مرور</h2><p style="margin:0;font-size:14px">استخدم الإيميل الذي أضافك به مالك المنصة.</p><form id="cf" style="display:grid;gap:12px">
    <label>البريد الإلكتروني<input id="ce" type="email" dir="ltr" required></label>
    <label>كلمة المرور (6 أحرف على الأقل)<input id="cp" type="password" dir="ltr" minlength="6" autocomplete="new-password" required></label>
    <div class="err" id="cerr"></div><button class="btn pri" style="padding:11px">إنشاء</button></form><div class="row"><button class="lnk" id="c-back">رجوع</button></div>`);
  $('#cf').onsubmit = async e => { e.preventDefault();
    try { const c = await A.createUserWithEmailAndPassword(auth, $('#ce').value.trim(), $('#cp').value); await A.sendEmailVerification(c.user); }
    catch (err) { $('#cerr').textContent = err.code === 'auth/email-already-in-use' ? 'يوجد حساب بهذا الإيميل، سجّل الدخول أو استعد كلمة المرور' : err.code === 'auth/weak-password' ? 'كلمة المرور قصيرة' : 'تعذر الإنشاء'; } };
  $('#c-back').onclick = () => showLogin();
}
function showReset() {
  authCard(`<h2>استعادة كلمة المرور</h2><form id="rf" style="display:grid;gap:12px"><label>البريد الإلكتروني<input id="re" type="email" dir="ltr" required></label>
    <div class="err" id="rerr"></div><button class="btn pri" style="padding:11px">إرسال رابط الاستعادة</button></form><div class="row"><button class="lnk" id="r-back">رجوع</button></div>`);
  $('#rf').onsubmit = async e => { e.preventDefault(); try { await A.sendPasswordResetEmail(auth, $('#re').value.trim()); $('#rerr').className = 'ok'; $('#rerr').textContent = 'أرسلنا الرابط إلى بريدك (افحص غير المرغوب أيضاً).'; } catch (err) { $('#rerr').textContent = 'تعذر الإرسال'; } };
  $('#r-back').onclick = () => showLogin();
}
function showVerify(u) {
  authCard(`<h2>تأكيد البريد</h2><p style="margin:0;font-size:14px">أرسلنا رسالة تأكيد إلى <b dir="ltr">${esc(u.email)}</b>. اضغط الرابط في الرسالة ثم «تم التأكيد».</p>
    <div class="err" id="verr"></div><button class="btn pri" style="padding:11px" id="vb">تم التأكيد</button>
    <div class="row"><button class="lnk" id="v-re">إعادة الإرسال</button><button class="lnk" id="v-out">خروج</button></div>`);
  $('#vb').onclick = async () => { await u.reload(); if (auth.currentUser.emailVerified) { await auth.currentUser.getIdToken(true); boot(auth.currentUser); } else $('#verr').textContent = 'لم يتم التأكيد بعد'; };

async function saveInv(i, data, msg) {
  try { await F.updateDoc(F.doc(fs, 'invoices', i.id), { ...data, updatedAt: nowIso() }); Object.assign(i, data); renderInv(); kpis(); toast(msg); return true; }
  catch (e) { toast('تعذر الحفظ: ' + (e.code === 'permission-denied' ? 'ليست لديك صلاحية' : e.code || e.message)); return false; }
}
function newInvoice(c0) {
  const cos = COS.filter(c => !isOpen(c));
  if (!cos.length) return toast('لا توجد شركات معتمدة');
  const c = c0 || cos[0]; const from = c.paidUntil && c.paidUntil >= today() ? addDays(c.paidUntil, 1) : today();
  const calc = fd => { const qty = +fd.get('qty') || 0, price = +fd.get('price') || 0, months = +fd.get('months') || 1, disc = +fd.get('disc') || 0, rate = vatRate();
    let sub = qty * price * months; const min = (+SET.minMonthly || 0) * months; if (sub < min) sub = min; sub = Math.max(0, sub - disc);
    sub = Math.round(sub * 100) / 100; const vat = Math.round(sub * rate) / 100; return { qty, price, months, disc, rate, sub, vat, total: Math.round((sub + vat) * 100) / 100, min }; };
  const f = dialog(`<h3>فاتورة جديدة</h3>
    <label>الشركة<select name="cid">${cos.map(x => `<option value="${esc(x.id)}" ${x.id === c.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
    <div class="g2"><label>من<input name="from" type="date" value="${from}" required></label><label>عدد الأشهر<input name="months" type="number" min="1" max="36" value="1" required></label></div>
    <div class="g2"><label>إلى<input name="to" type="date" value="${addMonths(from, 1)}" required></label><label>تاريخ الاستحقاق<input name="due" type="date" value="${addDays(today(), 7)}" required></label></div>
    <div class="g2"><label>عدد السيارات<input name="qty" type="number" min="1" value="${+c.vehicles || +(c.profile || {}).fleetSize || 1}" required></label><label>سعر السيارة شهرياً<input name="price" type="number" min="0" step="0.01" value="${esc(SET.pricePerVehicle || 0)}" required></label></div>
    <div class="g2"><label>خصم (ريال)<input name="disc" type="number" min="0" step="0.01" value="0"></label><label>الوصف<input name="desc" value="اشتراك نظام إدارة الأسطول"></label></div>
    <div class="sum" id="isum"></div>`, async fd => {
      const x = COS.find(y => y.id === fd.get('cid')); const t = calc(fd);
      try {
        const seq = await F.runTransaction(fs, async tr => { const r = F.doc(fs, 'platform', 'counters'); const s = await tr.get(r); const n = ((s.exists() && s.data().invoice) || 0) + 1; tr.set(r, { invoice: n }, { merge: true }); return n; });
        const p = x.profile || {};
        const inv = { number: `INV-${today().slice(0, 4)}-${String(seq).padStart(4, '0')}`, seq, cid: x.id, companyName: x.name, issueDate: today(), issuedAt: nowIso(), dueDate: fd.get('due'),
          periodFrom: fd.get('from'), periodTo: fd.get('to'), months: t.months, qty: t.qty, unitPrice: t.price, discount: t.disc, desc: fd.get('desc').trim(),
          subtotal: t.sub, vatRate: t.rate, vat: t.vat, total: t.total, status: 'unpaid', createdBy: ME.email,
          buyer: { name: p.legalName || x.name, vatNumber: p.vatNumber || '', crNumber: p.crNumber || '', address: [p.buildingNo, p.street, p.district, p.city, p.postalCode].filter(Boolean).join('، ') } };
        const ref = await F.addDoc(F.collection(fs, 'invoices'), inv); INVS.unshift({ id: ref.id, ...inv }); renderInv(); kpis(); toast(`صدرت الفاتورة ${inv.number} ✓`);
        if (FILE_ID) openFile(FILE_ID, true);
      } catch (e) { console.error(e); toast('تعذر إصدار الفاتورة: ' + (e.code || e.message)); }
    }, 'إصدار');
  const upd = () => { const t = calc(new FormData(f));
    $('#isum').innerHTML = `<div>${t.qty} سيارة × ${money(t.price)} × ${t.months} شهر${t.disc ? ` − خصم ${money(t.disc)}` : ''}${t.min && t.qty * t.price * t.months < t.min ? ` <small>(طُبّق الحد الأدنى ${money(t.min)})</small>` : ''}</div><div>قبل الضريبة: <b>${money(t.sub)}</b> · الضريبة ${t.rate}%: <b>${money(t.vat)}</b></div><div style="font-size:16px">الإجمالي: <b>${money(t.total)} ريال</b></div>`; };
  f.oninput = e => { if (['from', 'months'].includes(e.target.name)) f.to.value = addMonths(f.from.value, +f.months.value || 1);
    if (e.target.name === 'cid') { const x = COS.find(y => y.id === f.cid.value); f.qty.value = +x.vehicles || +(x.profile || {}).fleetSize || 1; f.from.value = x.paidUntil && x.paidUntil >= today() ? addDays(x.paidUntil, 1) : today(); f.to.value = addMonths(f.from.value, +f.months.value || 1); }
    upd(); };
  f.onchange = f.oninput; upd();
}
// رمز QR للفاتورة الضريبية المبسطة (المرحلة الأولى من الفوترة الإلكترونية – زاتكا)
function zatcaQR(seller, vatNo, ts, total, vat) {
  const enc = new TextEncoder(); const bytes = [];
  [seller, vatNo, ts, String(total), String(vat)].forEach((v, i) => { const b = enc.encode(v); bytes.push(i + 1, b.length, ...b); });
  let bin = ''; bytes.forEach(x => bin += String.fromCharCode(x));
  const q = window.qrcode(0, 'M'); q.addData(btoa(bin)); q.make(); return q.createDataURL(4, 0);
}

    .tot td{font-weight:600}.tot tr:last-child td{background:#0E5A44;color:#fff;font-size:16px}.muted{color:#5A6862;font-size:12px}
    .st{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;background:${i.status === 'paid' ? '#DCFAE6;color:#0E7A4F' : i.status === 'cancelled' ? '#FEE4E2;color:#B42318' : '#FEF0C7;color:#B54708'}}
    @media print{body{padding:0}.np{display:none}}@media (max-width:600px){.grid{grid-template-columns:1fr}body{padding:14px}}</style></head><body><div class="wrap">
    <div class="hd"><div><h1>فاتورة ضريبية مبسطة</h1><div class="muted">Simplified Tax Invoice</div><div style="margin-top:8px">رقم الفاتورة: <b dir="ltr">${esc(i.number)}</b></div><div>تاريخ الإصدار: ${fmt(i.issueDate)} · الاستحقاق: ${fmt(i.dueDate)}</div><div>الحالة: <span class="st">${esc((IST[i.status] || [i.status])[0])}</span></div></div>
      ${qr ? `<img src="${qr}" alt="QR" style="width:130px;height:130px">` : ''}</div>
    <div class="grid"><div class="box"><b>البائع</b><div>${esc(s.sellerName || '—')}</div>${s.sellerNameEn ? `<div dir="ltr" style="text-align:right">${esc(s.sellerNameEn)}</div>` : ''}<div>الرقم الضريبي: <span dir="ltr">${esc(s.vatNumber || '—')}</span></div>${s.crNumber ? `<div>السجل التجاري: ${esc(s.crNumber)}</div>` : ''}${s.address ? `<div>${esc(s.address)}</div>` : ''}${s.phone || s.email ? `<div dir="ltr" style="text-align:right">${esc([s.phone, s.email].filter(Boolean).join(' · '))}</div>` : ''}</div>
      <div class="box"><b>العميل</b><div>${esc(b.name || i.companyName)}</div><div>الرقم الضريبي: <span dir="ltr">${esc(b.vatNumber || '—')}</span></div>${b.crNumber ? `<div>السجل التجاري: ${esc(b.crNumber)}</div>` : ''}${b.address ? `<div>${esc(b.address)}</div>` : ''}</div></div>
    <table><thead><tr><th>البيان</th><th>الفترة</th><th>الكمية</th><th>سعر الوحدة شهرياً</th><th>الأشهر</th><th>المبلغ</th></tr></thead><tbody>
      <tr><td>${esc(i.desc || 'اشتراك')}</td><td>${fmt(i.periodFrom)} إلى ${fmt(i.periodTo)}</td><td>${esc(i.qty)} سيارة</td><td>${money(i.unitPrice)}</td><td>${esc(i.months || 1)}</td><td>${money((+i.qty) * (+i.unitPrice) * (+i.months || 1))}</td></tr></tbody></table>
    <table class="tot" style="width:min(380px,100%);margin-inline-start:auto"><tbody>${+i.discount ? `<tr><td>الخصم</td><td>${money(i.discount)}</td></tr>` : ''}<tr><td>الإجمالي قبل الضريبة</td><td>${money(i.subtotal)}</td></tr><tr><td>ضريبة القيمة المضافة ${esc(i.vatRate)}%</td><td>${money(i.vat)}</td></tr><tr><td>الإجمالي شامل الضريبة (ريال)</td><td>${money(i.total)}</td></tr></tbody></table>

  w.document.close();
}

async function loadStaff() {
  $('#roleHelp').innerHTML = '<b>صلاحيات الأدوار</b>' + Object.values(ROLES).map(([l, d]) => `<div><b>${l}:</b> ${d}</div>`).join('');
  try { const s = await F.getDocs(F.collection(fs, 'staff')); STAFF = s.docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) { STAFF = []; }
  $('#srows').innerHTML = STAFF.length ? STAFF.map(x => `<tr><td>${esc(x.name || '')}${x.phone ? `<small dir="ltr" style="text-align:right">${esc(x.phone)}</small>` : ''}</td><td dir="ltr" style="text-align:right">${esc(x.id)}</td><td>${esc((ROLES[x.role] || [x.role])[0])}</td>
    <td>${x.active ? '<span class="pill p-active">فعّال</span>' : '<span class="pill p-off">موقوف</span>'}</td>
    <td><div class="acts"><button class="btn" data-s="edit" data-id="${esc(x.id)}">تعديل</button><button class="btn ${x.active ? 'bad' : ''}" data-s="toggle" data-id="${esc(x.id)}">${x.active ? 'إيقاف' : 'تفعيل'}</button><button class="btn bad" data-s="del" data-id="${esc(x.id)}">حذف</button></div></td></tr>`).join('')
    : `<tr><td colspan="5" class="empty">لم تُضف مستخدمين بعد. أضف موظفيك (محاسب، مبيعات، دعم فني…) ثم يدخلون من هذه الصفحة باختيار «أنشئ كلمة مرور».</td></tr>`;
}
function staffDialog(x) {
  const f = dialog(`<h3>${x ? 'تعديل مستخدم' : 'إضافة مستخدم للفريق'}</h3>
    <label>الإيميل<input name="email" type="email" dir="ltr" value="${esc(x ? x.id : '')}" ${x ? 'readonly' : ''} required></label>
    <label>الاسم<input name="name" value="${esc(x ? x.name || '' : '')}" required></label>
    <label>الجوال<input name="phone" dir="ltr" value="${esc(x ? x.phone || '' : '')}"></label>

$('#addStaff').onclick = () => staffDialog(null);
$('#srows').onclick = async e => { const b = e.target.closest('[data-s]'); if (!b) return; const x = STAFF.find(y => y.id === b.dataset.id);
