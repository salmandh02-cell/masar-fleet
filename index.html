<style>
/* Layout: sticky signage-green header with tab rail; content column of panels; vehicles shown as Saudi plates */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#F6F7F4; --ink:#16302A; --muted:#6F7B75; --line:#E1E5E0;
  --accent:#173B33; --accent-2:#173B33; --accent-ink:#FFFFFF; --accent-soft:#E7EDE9; --brass:#A88653;
  --ok:#23824A; --ok-soft:#E1F3E7; --warn:#A66A0E; --warn-soft:#FBEFD9; --crit:#B42318; --crit-soft:#FBE4E1;
  --info:#2B5C9E; --info-soft:#E2ECF8; --idle:#6B7280; --idle-soft:#ECEEF1;
  --plate-bg:#FFFFFF; --plate-ink:#111; --plate-line:#1B1B1B;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 4px 14px rgba(20,32,27,.05);
  --f-display:"Alexandria","Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme]){
  --bg:#0F1412; --surface:#161D1A; --surface-2:#1B2420; --ink:#E5ECE8; --muted:#97A59E; --line:#2A3531;
  --accent:#3DBB8C; --accent-2:#5BD0A3; --accent-ink:#06261B; --accent-soft:#163A2D;
  --ok:#5BC27D; --ok-soft:#173424; --warn:#E4A646; --warn-soft:#3A2C13; --crit:#F2675C; --crit-soft:#3E1C19;
  --info:#7FAEF0; --info-soft:#1A2A40; --idle:#A3AAB5; --idle-soft:#252B31;
  --plate-bg:#F4F4F1; --plate-ink:#111; --plate-line:#111;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; --head:#0F3B2D}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161D1A; --surface-2:#1B2420; --ink:#E5ECE8; --muted:#97A59E; --line:#2A3531;
  --accent:#3DBB8C; --accent-2:#5BD0A3; --accent-ink:#06261B; --accent-soft:#163A2D;
  --ok:#5BC27D; --ok-soft:#173424; --warn:#E4A646; --warn-soft:#3A2C13; --crit:#F2675C; --crit-soft:#3E1C19;
  --info:#7FAEF0; --info-soft:#1A2A40; --idle:#A3AAB5; --idle-soft:#252B31;
  --plate-bg:#F4F4F1; --plate-ink:#111; --plate-line:#111;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; --head:#0F3B2D}
:root[data-theme="navy"]{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#141C2E; --muted:#5B6578; --line:#D6DDEA;
  --accent:#1F4FBF; --accent-2:#172F66; --accent-ink:#FFFFFF; --accent-soft:#E0E8FA;
  --info:#0E7490; --info-soft:#DDF2F6; --shadow:0 1px 2px rgba(20,28,46,.06),0 4px 14px rgba(20,28,46,.06)}
:root[data-theme="sand"]{
  --bg:#F3EEE5; --surface:#FFFDF8; --surface-2:#F8F3EA; --ink:#25211A; --muted:#6E665A; --line:#E2D8C6;
  --accent:#8A6420; --accent-2:#2F2A22; --accent-ink:#FFFFFF; --accent-soft:#F1E5CC;
  --shadow:0 1px 2px rgba(47,42,34,.06),0 4px 14px rgba(47,42,34,.06)}
:root[data-theme="graphite"]{
  --bg:#F0F1F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#1B1E23; --muted:#626873; --line:#D9DCE1;
  --accent:#3E4A5C; --accent-2:#22262D; --accent-ink:#FFFFFF; --accent-soft:#E3E6EB;
  --shadow:0 1px 2px rgba(27,30,35,.06),0 4px 14px rgba(27,30,35,.05)}
:root[data-theme="night"]{
  --bg:#0E1320; --surface:#151C2C; --surface-2:#1A2236; --ink:#E4E9F2; --muted:#98A2B6; --line:#28324A;
  --accent:#6D9BFF; --accent-2:#0A0F1A; --accent-ink:#071026; --accent-soft:#1B2A4A;
  --ok:#5BC27D; --ok-soft:#173424; --warn:#E4A646; --warn-soft:#3A2C13; --crit:#F2675C; --crit-soft:#3E1C19;
  --info:#5CC8D8; --info-soft:#14313A; --idle:#A3AAB5; --idle-soft:#252B31;
  --plate-bg:#F4F4F1; --plate-ink:#111; --plate-line:#111;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
html[data-fs="lg"] body{zoom:1.12}
html[data-fs="xl"] body{zoom:1.25}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.th-card{border:2px solid var(--line);border-radius:12px;padding:0;background:var(--surface);cursor:pointer;text-align:start;overflow:hidden}
.th-card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.th-prev{height:74px;display:flex;flex-direction:column}.th-prev i{height:18px}.th-prev span{flex:1;display:flex;gap:6px;padding:8px}.th-prev span b{flex:1;border-radius:5px}
.th-card div{padding:8px 10px;font-weight:600;font-size:13.5px}
.fs-row{display:flex;gap:8px;flex-wrap:wrap}.fs-row button{min-width:84px}
.fs-row button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head,var(--accent-2))}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head,var(--accent-2));color:#fff}
.top-in{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:58px}
.menu-btn{display:none;width:40px;height:40px;border-radius:9px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;place-items:center}
.menu-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
.brand-mark{width:38px;height:26px;border:2px solid #fff;border-radius:4px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em}
.brand-mark.has-logo{width:auto;height:36px;border:0;background:#fff;border-radius:8px;padding:3px 6px;display:grid!important}.brand-mark.has-logo img{height:30px;max-width:96px;object-fit:contain;display:block}
.brand h1{font-size:18px;font-weight:600}
.brand small{display:block;font-size:12px;opacity:.75;font-family:var(--f-body)}
.brand-logo{height:40px;max-width:120px;padding:4px 8px;background:#fff;border-radius:8px;display:flex;align-items:center;flex:none}.brand-logo img{max-height:32px;max-width:104px;object-fit:contain;display:block}
.co-hero{display:flex;align-items:center;gap:16px}.co-hero .co-logo{height:72px;max-width:180px;padding:8px 12px;background:#fff;border:1px solid var(--line,#e3e7e5);border-radius:12px;display:flex;align-items:center;flex:none}.co-hero .co-logo img{max-height:56px;max-width:156px;object-fit:contain;display:block}
.logo-prev{display:flex;align-items:center;gap:12px;margin-top:8px}.logo-prev img{max-height:64px;max-width:180px;object-fit:contain;background:#fff;border:1px solid #e3e7e5;border-radius:10px;padding:6px}
.brand .spacer{flex:1}
.mode-btn{height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit;font:600 12.5px var(--f-body);padding:0 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}.mode-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.rolechip{font-size:12px;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){.rolechip{display:none}}
.sync{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#9BE7C4;display:inline-block}
.sync.off i{background:#F3B04B}
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{padding-block:20px 60px;padding-inline-start:24px;display:grid;gap:18px;align-content:start;min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;max-height:calc(100vh - 58px);overflow:auto;padding-block:18px 24px;display:grid;gap:16px;align-content:start;border-inline-end:1px solid var(--line);padding-inline-end:14px}
.side .grp{display:grid;gap:2px}
.side .grp>span{font-size:11.5px;color:var(--muted);padding:0 10px 4px;letter-spacing:.02em;font-weight:500}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:14px;min-height:38px}
.side a:hover{background:var(--surface)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0;opacity:.85}
.side a b{margin-inline-start:auto;font-family:var(--f-mono);font-size:11px;border-radius:9px;padding:1px 7px;background:var(--idle-soft);color:var(--idle);font-weight:600}
.side a b.c{background:var(--crit-soft);color:var(--crit)}
.side a b.w{background:var(--warn-soft);color:var(--warn)}
.scrim{display:none}
@media (max-width:960px){
  .menu-btn{display:grid}
  .shell{grid-template-columns:minmax(0,1fr)}
  main{padding-inline-start:0}
  .side{position:fixed;top:0;bottom:0;align-self:stretch;height:100%;inset-inline-start:0;width:min(290px,86vw);max-height:none;z-index:45;background:var(--bg);border:0;box-shadow:0 0 40px rgba(0,0,0,.25);padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(105%);transition:transform .22s ease;visibility:hidden}
  .side.open{transform:none;visibility:visible}
  .side.open+.scrim{display:block;position:fixed;inset:0;z-index:44;background:rgba(8,14,11,.45)}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h2{font-size:22px;font-weight:600}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:15px;font-weight:600}
.panel-h span{color:var(--muted);font-size:12.5px}
.panel-b{padding:14px 16px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;width:max-content;max-width:100%}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-idle{background:var(--idle-soft);color:var(--idle)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

/* fleet strip */
.strip{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-2);gap:2px}
.strip div{height:100%}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media (max-width:620px){.legend{grid-template-columns:repeat(2,1fr)}}
.legend div{display:grid;gap:2px;padding-inline-start:10px;border-inline-start:3px solid var(--c)}
.legend b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1}
.legend span{color:var(--muted);font-size:12.5px}
.c-avail{--c:var(--ok)} .c-asg{--c:var(--info)} .c-mnt{--c:var(--warn)} .c-out{--c:var(--idle)}

.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:860px){.quick{grid-template-columns:repeat(2,1fr)}}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;cursor:pointer;display:grid;gap:4px;box-shadow:var(--shadow)}
.quick button:hover{border-color:var(--accent)}
.quick b{font-family:var(--f-display);font-weight:600;font-size:14.5px}
.quick span{color:var(--muted);font-size:12px}
.quick svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8}

.alerts{display:grid;gap:0;max-height:440px;overflow:auto}
.alert{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.alert:last-child{border-bottom:0}
.alert:hover{background:var(--surface-2)}
.alert .sev{align-self:stretch;border-radius:2px}
.alert.crit .sev{background:var(--crit)} .alert.warn .sev{background:var(--warn)}
.alert b{font-weight:600;font-size:13.5px;display:block}
.alert small{color:var(--muted);font-size:12.5px}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}

.feed{display:grid}
.feed-i{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.feed-i:last-child{border-bottom:0}
.feed-i .t{font-size:13.5px}
.feed-i small{color:var(--muted);font-size:12px;display:block}
.dir{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;font-weight:700}
.dir.out{background:var(--info-soft);color:var(--info)} .dir.in{background:var(--ok-soft);color:var(--ok)}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv div{display:grid;gap:2px}
.kv span{color:var(--muted);font-size:12.5px}
.kv b{font-family:var(--f-display);font-size:20px;font-weight:600}

/* Saudi plate */
.plate{display:inline-grid;grid-template-columns:auto auto auto;direction:rtl;background:var(--plate-bg);color:var(--plate-ink);border:2px solid var(--plate-line);border-radius:5px;overflow:hidden;font-family:var(--f-mono);line-height:1;vertical-align:middle;flex-shrink:0}
.plate .ksa{background:#fff;border-inline-end:1.5px solid var(--plate-line);display:grid;place-items:center;padding:0 3px;font-size:7px;font-weight:600;writing-mode:vertical-rl;letter-spacing:.08em;color:#0B6B4F}
.plate .cell{display:grid;grid-template-rows:1fr 1fr}
.plate .cell + .cell{border-inline-start:1.5px solid var(--plate-line)}
.plate .cell span{display:grid;place-items:center;padding:3px 7px;font-weight:600;font-size:13px;white-space:nowrap}
.plate .cell span + span{border-top:1.5px solid var(--plate-line)}
.plate .ar{font-family:var(--f-display);font-size:14px}
.plate.lg .cell span{font-size:20px;padding:6px 12px}
.plate.lg .ar{font-size:21px}
.plate.lg .ksa{font-size:9px;padding:0 5px}

/* vehicles grid */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;max-width:360px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;cursor:pointer;box-shadow:var(--shadow);text-align:start}
.vcard:hover{border-color:var(--accent)}
.vcard .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vcard h3{font-size:15px;font-weight:600}
.vcard .meta{color:var(--muted);font-size:12.5px}
.vcard .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px}
.vcard .facts span{color:var(--muted);display:block}
.vcard .docs{display:flex;gap:6px;flex-wrap:wrap}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{color:var(--muted);font-size:12px}

.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.warn i{background:var(--warn)} .bar.crit i{background:var(--crit)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-size:13.5px}
.banner b{color:var(--warn)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,16,13,.5);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid;margin:auto 0}
.modal.wide{max-width:900px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{font-size:17px;font-weight:600}

#pdf-sheet{position:fixed;top:0;left:-12000px;width:794px;background:#fff;color:#111;font-family:var(--f-body);font-size:13px;line-height:1.6;padding:34px 38px;display:grid;gap:10px;color-scheme:light}
#pdf-sheet .ph-logo{display:block;max-height:52px;max-width:170px;object-fit:contain;margin-bottom:6px}
#pdf-sheet .ph{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;border-bottom:3px solid #0B6B4F;padding-bottom:12px}
#pdf-sheet .co{font-family:var(--f-display);font-weight:700;font-size:17px;color:#0B6B4F}
#pdf-sheet .cs{font-size:11.5px;color:#555}
#pdf-sheet .pt{font-family:var(--f-display);font-weight:700;font-size:21px;text-align:center;display:grid}
#pdf-sheet .pt small{font-size:11.5px;font-weight:400;color:#555;font-family:var(--f-body)}
#pdf-sheet .pn{justify-self:end;display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:11.5px;color:#555;align-items:center}
#pdf-sheet .pn b{color:#111;font-family:var(--f-mono);font-size:12.5px}
#pdf-sheet .sec2{font-family:var(--f-display);font-weight:600;font-size:13.5px;background:#E9F3EE;color:#0B4A37;padding:4px 10px;border-radius:4px;margin-top:4px}
#pdf-sheet table{width:100%;border-collapse:collapse}
#pdf-sheet .kvt th,#pdf-sheet .kvt td,#pdf-sheet .ck th,#pdf-sheet .ck td{border:1px solid #9AA59F;padding:5px 8px;text-align:start;font-size:12.5px;background:#fff;color:#111}
#pdf-sheet .kvt th{background:#F3F5F4;font-weight:500;width:17%;white-space:nowrap}
#pdf-sheet .ck th{background:#F3F5F4;font-weight:500}
#pdf-sheet .ck td.m{text-align:center;width:9%;font-size:14px;color:#0B6B4F}
#pdf-sheet .ck td.x{color:#B42318}
#pdf-sheet .fb{display:inline-flex;gap:2px;vertical-align:middle}
#pdf-sheet .fb i{width:12px;height:10px;border:1px solid #555;display:inline-block}
#pdf-sheet .fb i.on{background:#0B6B4F;border-color:#0B6B4F}
#pdf-sheet .box{border:1px solid #9AA59F;min-height:62px;padding:8px 10px;border-radius:4px}
#pdf-sheet .g{color:#555;font-size:12px}
#pdf-sheet .dec{margin:4px 0 0;font-size:12.5px;text-align:justify}
#pdf-sheet .sg td{border:1px solid #9AA59F;padding:10px;vertical-align:top;width:33.3%;height:120px}
#pdf-sheet .sg b{display:block;font-family:var(--f-display);margin-bottom:8px}
#pdf-sheet .sg span{display:block;color:#444;font-size:12px;padding-bottom:12px}
#pdf-sheet .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#pdf-sheet .kp div{border:1px solid #C9D1CC;border-radius:6px;padding:8px 10px;display:grid;gap:2px}
#pdf-sheet .kp span{font-size:11.5px;color:#555}
#pdf-sheet .kp b{font-family:var(--f-display);font-size:18px;color:#111}
#pdf-sheet .kp small{font-size:11px;color:#0B6B4F}
#pdf-sheet .kp small.up{color:#B42318}
#pdf-sheet .tb th{width:auto}
#pdf-sheet .tb td,#pdf-sheet .tb th{font-size:12px;padding:4px 7px}
#pdf-sheet.prev{position:static;left:auto;width:794px;box-shadow:0 2px 10px rgba(0,0,0,.12);margin:0 auto}
.prevwrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:8px;background:#DDE2DF;padding:0}
#pdf-sheet .rt th,#pdf-sheet .rt td{font-size:11px;padding:4px 6px;white-space:normal}
#pdf-sheet .rt th{background:#E9F3EE;color:#0B4A37;font-weight:600}
#pdf-sheet .rt tbody tr:nth-child(even) td{background:#F7F9F8}
#pdf-sheet .rv-amt{border:2px solid #0B6B4F;border-radius:6px;padding:6px 16px;font-family:var(--f-mono);font-size:20px;font-weight:600;color:#0B6B4F}
#pdf-sheet .rv-amt small{font-size:12px}
#pdf-sheet .rv{width:100%;border-collapse:collapse}
#pdf-sheet .rv th,#pdf-sheet .rv td{border-bottom:1px dashed #9AA59F;padding:12px 8px;font-size:14px;text-align:start;vertical-align:top}
#pdf-sheet .rv th{width:22%;color:#444;font-weight:500}
#pdf-sheet .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#pdf-sheet .pgrid img{width:100%;height:290px;object-fit:contain;border:1px solid #C9D1CC;background:#F4F6F5;border-radius:4px;display:block}
#pdf-sheet .pf{text-align:center;font-size:10.5px;color:#777;border-top:1px solid #ddd;padding-top:6px;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.ov .modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}}

.logout{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:transparent;color:inherit;cursor:pointer;flex:none}
.logout svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logout:hover{background:rgba(255,255,255,.12)}

.msg-btn{background:transparent;position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.25);color:inherit;flex:none}
.msg-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msg-btn b{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#D92D20;color:#fff;font:700 11px/18px var(--f-body);text-align:center}
.ib{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100vh - 210px);min-height:440px;overflow:hidden}
.ib-list{border-inline-end:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
.ib-tools{display:flex;gap:6px;padding:10px;position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ib-tools input{flex:1;min-width:120px}
.ib-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;cursor:pointer;width:100%;color:inherit;font:inherit}
.ib-item:hover{background:var(--surface-2)}.ib-item.on{background:var(--accent-soft,#E3F1EB)}
.ib-item .av,.ib-h .av,.drv-msg .av{width:38px;height:38px;border-radius:50%;background:var(--accent,#0E5A44);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ib-m{flex:1;min-width:0;display:grid}.ib-m b{font-size:14px}.ib-m small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-item.un .ib-m b,.ib-item.un .ib-m small{color:var(--ink);font-weight:700}
.ib-r{display:grid;justify-items:end;gap:3px}.ib-r small{color:var(--muted);font-size:11px}.ib-r i{width:10px;height:10px;border-radius:50%;background:#D92D20}.ib-r em{font-style:normal;font-size:10px;color:var(--muted)}
.ib-chat{display:flex;flex-direction:column;min-height:0;background:var(--surface-2)}
.ib-empty{display:grid;place-items:center}
.ib-h{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}.ib-h small{display:block;color:var(--muted)}
.ib-back{display:none}
.ib-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.ib-day{align-self:center;font-size:11px;color:var(--muted);background:var(--surface);padding:2px 10px;border-radius:10px;margin:6px 0}
.bub{max-width:75%;padding:8px 12px;border-radius:14px;line-height:1.6;box-shadow:0 1px 1px rgba(0,0,0,.06);display:grid;gap:3px}
.bub.me{align-self:flex-start;background:#D9F2E6;border-start-start-radius:4px}
.bub.them{align-self:flex-end;background:var(--surface);border-start-end-radius:4px}
.bub small{font-size:10.5px;color:var(--muted);justify-self:end}.bub .rd{color:#1570EF;font-weight:700}
.bub .tag{font-size:11px;color:var(--muted)}
.refc{justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font:inherit;font-size:12px;cursor:pointer;color:var(--accent,#0E5A44)}
.ib-refbar{padding:6px 14px;background:var(--warn-soft,#FFF7E6);font-size:13px;display:flex;gap:8px;align-items:center}
.ib-in{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--line);align-items:flex-end}
.ib-in textarea{flex:1;resize:none;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;max-height:140px;background:var(--surface-2);color:inherit}
.pp-list{display:grid;max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}.pp-list.sm{max-height:34vh}
.pp-list label.ib-item input{width:18px;height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips label.chip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.drv-msg{text-decoration:none;color:inherit}
@media (max-width:760px){.ib{grid-template-columns:1fr;height:calc(100vh - 190px)}.ib.has-chat .ib-list{display:none}.ib:not(.has-chat) .ib-chat{display:none}.ib-back{display:inline-flex}.bub{max-width:88%}}
.push-card{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--accent,#0E5A44);border-radius:12px;background:var(--accent-soft,#E3F1EB);font-size:14px;margin-bottom:10px}.push-card.ok{border-style:solid}
.sign-box{display:grid;gap:8px;padding:12px;border:2px solid var(--warn,#B7791F);border-radius:14px;background:var(--warn-soft,#FFF7E6);margin-bottom:12px}
.sign-ok{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);line-height:1.7}
.sign-ok input{margin-top:5px;width:20px;height:20px;flex:none}
[hidden]{display:none!important}
.lang-pick{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.lang-pick button{font:500 13px var(--f-body,"IBM Plex Sans Arabic"),system-ui,sans-serif;padding:6px 12px;min-height:36px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lang-pick button.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* ملصق QR */
.qrs{width:368px;height:512px;background:#fff;color:#14231c;border:2px solid #0B6B4F;border-radius:22px;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;font-family:var(--f-display),system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.12);--plate-bg:#fff;--plate-ink:#111;--plate-line:#1B1B1B}
.qrs-h{background:linear-gradient(135deg,#0B6B4F,#0E8A63);color:#fff;padding:16px 18px 14px;text-align:center;position:relative}

.qrs-logo{display:inline-flex;background:#fff;border-radius:8px;padding:4px 10px;margin-bottom:8px}.qrs-logo img{max-height:34px;max-width:140px;object-fit:contain;display:block}
.qrs-co{font-size:20px;font-weight:700;line-height:1.3}
.qrs-t{font-size:12.5px;opacity:.9;margin-top:2px;letter-spacing:.02em}
.qrs-b{display:grid;justify-items:center;align-content:start;gap:8px;padding:8px 18px 4px}
.qrs-pl .plate{transform:scale(1.05)}
.qrs-vn{font-size:13px;color:#55635c}
.qrs-q{position:relative;padding:12px;margin-top:4px}
.qrs-q img{width:184px;height:184px;display:block;image-rendering:pixelated}
.qrs-q i{position:absolute;width:26px;height:26px;border:4px solid #0B6B4F}
.qrs-q .c1{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:12px}
.qrs-q .c2{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:12px}
.qrs-q .c3{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:12px}
.qrs-q .c4{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:12px}
.qrs-cap{text-align:center;display:grid;gap:3px}
.qrs-cap b{font-size:16px;color:#0B6B4F}
.qrs-cap span{font-size:11.5px;color:#55635c}
.qrs-f{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:#F1F6F3;border-top:1px solid #DCE8E1;font-size:11px;color:#55635c}
.qrs-f b{font-family:var(--f-mono);color:#14231c}
.qrs-host{position:fixed;left:-2000px;top:0;padding:0;background:transparent}
.qrs-host .qrs{box-shadow:none}
.qrs-wrap{max-width:100%;overflow:auto}
@media (max-width:420px){.qrs-wrap .qrs{zoom:.82}}
.rem-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.rem-row .sub{grid-column:1;font-size:12.5px}
.rem-row .btn{grid-row:1/3;grid-column:2}

/* ===== هوية «سكون» ===== */
:root{--r:14px;--shadow:none;--brass:#A88653}
body::before{background:var(--surface)}
.top{background:var(--surface)!important;color:var(--ink);border-bottom:1px solid var(--line)}
.brand h1{font-weight:500;font-size:17px}.brand small{opacity:1;color:var(--muted)}
.brand-mark{border:0;overflow:hidden;background:var(--accent);color:#EDE3CC;width:38px;height:38px;border-radius:11px;font:600 11px var(--f-mono)}
.menu-btn,.msg-btn,.logout{border-color:var(--line)!important;color:var(--ink)!important;background:var(--surface)!important}
.menu-btn:hover,.msg-btn:hover,.logout:hover{background:var(--surface-2)!important}
.srch-btn{background:var(--surface-2)!important;border:1px solid var(--line)!important;color:var(--muted)!important;border-radius:11px!important;opacity:1!important}.srch-btn kbd{background:var(--line)!important;color:var(--ink)}
.rolechip{background:var(--accent-soft);color:var(--accent)}
.mode-btn{border-color:var(--line);background:var(--surface-2)}
.sync{color:var(--muted);opacity:1}.sync i{background:#3C8A62}
.side{background:transparent}
.side a{font-weight:400;color:#4C5953;border-radius:10px;min-height:40px;position:relative}
.side a:hover{background:var(--surface)}
.side a.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.side a.on::before{content:"";position:absolute;inset-inline-start:-1px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--brass)}
.panel{border-radius:16px;box-shadow:none}
.panel-h{border-bottom:0;padding:18px 22px 6px}.panel-h h3{font-weight:500;font-size:16.5px}
.panel-b{padding:14px 22px 20px}
.btn{border-radius:11px;padding:9px 16px}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.head h2{font-weight:500;font-size:28px}
.alert{border-bottom-color:var(--line)}
.quick button{box-shadow:none;border-radius:14px}
/* الرئيسية */
.hello small{color:var(--muted);font-size:13.5px}.hello h2{margin-top:2px}
.dash-acts{display:flex;gap:10px;flex-wrap:wrap}.dash-acts .btn{height:44px;padding:0 18px}
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat4 button{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:2px;cursor:pointer;position:relative}
.stat4 button:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.stat4 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat4 .l{display:flex;align-items:center;gap:8px;font-weight:500}.stat4 .l::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.stat4 b{font:500 42px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.stat4 small{color:var(--muted);font-size:12.5px}
.stat4 svg{position:absolute;inset-inline-end:18px;top:20px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;opacity:.6;transform:scaleX(-1)}
.opt-ids{border:1px dashed var(--line);border-radius:14px;padding:12px 14px 4px;background:var(--surface-2)}.opt-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}.opt-h b{font-weight:500}.opt-h span{color:var(--muted);font-size:12.5px}.opt-g{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media (max-width:620px){.opt-g{grid-template-columns:1fr}}
.ai-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ai-btn{display:inline-flex;align-items:center;gap:8px;border-color:color-mix(in srgb,var(--brass) 55%,var(--line));color:var(--ink)}.ai-btn svg{width:17px;height:17px;fill:color-mix(in srgb,var(--brass) 25%,transparent);stroke:var(--brass);stroke-width:1.6}

.ai-dmg{margin-top:10px;border-radius:12px;padding:12px 14px;border:1px solid var(--line);display:grid;gap:6px}.ai-dmg.crit{border-color:var(--crit);background:var(--crit-soft)}.ai-dmg.warn{border-color:var(--warn);background:var(--warn-soft)}.ai-dmg.ok{background:var(--ok-soft)}.ai-dmg p{margin:0}.ai-dmg ul{margin:0;padding-inline-start:18px}.ai-dmg small{color:var(--muted)}.ai-dmg .btn{justify-self:start}
.ai-chat .panel-b{display:grid;gap:12px;max-height:calc(100dvh - 330px);min-height:260px;overflow:auto}
.ai-m{max-width:min(760px,92%);padding:12px 16px;border-radius:16px;line-height:1.75}.ai-m.user{justify-self:start;background:var(--accent);color:#fff;border-end-start-radius:4px}.ai-m.assistant{justify-self:end;background:var(--surface-2);border:1px solid var(--line);border-end-end-radius:4px}
.ai-m p{margin:0 0 6px}.ai-m h4{margin:8px 0 4px;font:500 15px var(--f-display)}.ai-m ul{margin:0 0 6px;padding-inline-start:20px}.ai-m table{font-size:13px}.ai-wait{color:var(--muted)}
.ai-sug{display:flex;flex-wrap:wrap;gap:8px}.ai-sug .btn{font-size:13.5px;border-radius:999px}
.ai-in{display:flex;gap:10px;align-items:flex-end;padding:12px 18px 0;border-top:1px solid var(--line)}.ai-in textarea{flex:1;resize:vertical;min-height:52px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:var(--surface);color:var(--ink)}.ai-in .btn{height:52px;padding:0 22px}
.acc{max-width:620px;width:100%;margin:0 auto;display:grid;gap:10px}.acc-hd{display:grid;justify-items:center;gap:6px;margin:6px 0 8px}.acc-av{width:76px;height:76px;border-radius:50%;background:var(--accent);color:#EDE3CC;display:grid;place-items:center;font:500 30px var(--f-display)}.acc-hd h2{font-weight:500;font-size:22px}.acc-roles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.acc-roles span{font-size:12.5px;padding:4px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.acc h3{font:500 14px var(--f-body);color:var(--muted);margin:12px 4px 0}.acc-list{padding:0 18px}.acc-it{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.acc-it:first-child{border-top:0}.acc-it>svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}.acc-it>div{flex:1;min-width:0}.acc-it b{display:block;font-weight:500}.acc-it span{font-size:13px;color:var(--muted);display:inline-block}.acc-it i{font-style:normal;color:var(--brass)}.acc-it small{color:var(--muted);font-size:12px}.acc-note{color:var(--muted);font-size:13px;margin:4px 4px 0}
.dash-acts .btn svg,.more-acts .btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
a.rolechip{text-decoration:none}

@media (max-width:620px){.brand h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}.brand small{display:none}.top .msg-btn[data-act=theme],.top .logout,.sync{display:none!important}.brand-mark{width:34px;height:34px}}
.side{top:calc(env(safe-area-inset-top,0px) + var(--toph,58px))!important;max-height:calc(100vh - var(--toph,58px) - 12px)!important;max-height:calc(100dvh - var(--toph,58px) - 12px)!important;padding-bottom:28px!important}

/* ===== هوية «مسار» الفاخرة: زمردي وذهبي على عاجي ===== */
:root{--gold:#C9A24F;--gold-ink:#94722F;--gold-soft:#F6EEDC;--em-1:#08251E;--em-2:#0E3B30;--em-3:#145244;

:root[data-theme="light"]{--bg:#F5F3EE;--surface:#FFFFFF;--surface-2:#FAF8F3;--ink:#10241E;--muted:#6B746E;--line:#E7E2D7;--accent:#0E3B30;--accent-2:#08251E;--accent-soft:#E6EFEA;--brass:#C9A24F}
@media (prefers-color-scheme: light){:root:not([data-theme]){--bg:#F5F3EE;--surface:#FFFFFF;--surface-2:#FAF8F3;--ink:#10241E;--muted:#6B746E;--line:#E7E2D7;--accent:#0E3B30;--accent-2:#08251E;--accent-soft:#E6EFEA;--brass:#C9A24F}}
:root[data-theme="navy"]{--head-grad:linear-gradient(115deg,#0B1736,#172F66 60%,#1F4FBF)}
:root[data-theme="sand"]{--head-grad:linear-gradient(115deg,#1F1B15,#2F2A22 60%,#4A3B22)}
:root[data-theme="graphite"]{--head-grad:linear-gradient(115deg,#15181D,#22262D 60%,#3E4A5C)}
:root[data-theme="night"]{--head-grad:linear-gradient(115deg,#05080F,#0A0F1A 60%,#16213A)}
@media (prefers-color-scheme: dark){:root:not([data-theme]){--head-grad:linear-gradient(115deg,#04140F,#0A2A21 60%,#0F3B2D)}}
:root[data-theme="dark"]{--head-grad:linear-gradient(115deg,#04140F,#0A2A21 60%,#0F3B2D)}
body{background:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--gold) 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
body::before{background:var(--em-1)}

/* القائمة الجانبية */

/* العناوين */
.head h2,.hello h2{font-weight:600;color:var(--accent);letter-spacing:-.01em}

.head h2::after,.hello h2::after{content:"";display:block;width:44px;height:3px;border-radius:3px;margin-top:8px;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 20%,transparent))}

.stat4 button:hover{box-shadow:var(--lux-shadow-h);transform:translateY(-2px)}

.quick button{box-shadow:var(--lux-shadow);border-radius:16px}
.quick button:hover{border-color:var(--gold);box-shadow:var(--lux-shadow-h)}
.quick svg{stroke:var(--gold-ink)}
/* الأزرار */
.btn{border-radius:12px;transition:border-color .15s,box-shadow .15s,background .15s}
.btn:hover{border-color:color-mix(in srgb,var(--gold) 70%,var(--line))}
.btn.primary{background:linear-gradient(135deg,var(--em-3),var(--em-2) 55%,var(--em-1));border-color:var(--em-1);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 16px -8px rgba(8,37,30,.6)}
.btn.primary:hover{background:linear-gradient(135deg,var(--em-3),var(--em-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
:root:is([data-theme="navy"],[data-theme="sand"],[data-theme="graphite"],[data-theme="night"]) .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{color:var(--accent)}
/* الشروحات */
.tipbox{background:linear-gradient(135deg,var(--gold-soft),color-mix(in srgb,var(--gold-soft) 40%,var(--surface)));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-inline-start:3px solid var(--gold);border-radius:16px;padding:14px 18px}
.tipbox-i{background:linear-gradient(135deg,var(--gold),var(--gold-ink));color:#fff}
:root:is([data-theme="dark"],[data-theme="night"]) .tipbox{background:color-mix(in srgb,var(--gold) 10%,var(--surface));color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme]) .tipbox{background:color-mix(in srgb,var(--gold) 10%,var(--surface))}}
/* الجداول والشارات */
th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.01em;border-bottom:1px solid var(--line)}
tbody tr{transition:background .12s}tbody tr:hover{background:color-mix(in srgb,var(--gold) 5%,transparent)}
.pill{font-weight:600;border:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.p-acc{background:var(--gold-soft);color:var(--gold-ink)}
input:not([type=checkbox]):not([type=radio]),select,textarea{border-radius:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
/* الجوال */
.bnav{background:color-mix(in srgb,var(--surface) 92%,transparent)!important;backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bnav a.on,.bnav button.on{color:var(--accent)!important}
.bnav a.on::before,.bnav button.on::before{content:"";position:absolute;top:0;inset-inline:30%;height:2px;border-radius:2px;background:var(--gold)}
@media (max-width:960px){.side a.on{background:var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.stat4 button,.btn,tbody tr{transition:none}.stat4 button:hover{transform:none}}

</style>
</head>

<div id="app" dir="rtl" lang="ar">

      <div><h1>مسار</h1><small>السيارات · السائقون · العهد · الصيانة · المخالفات</small></div>

<script>
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const COLS=['vehicles','drivers','handovers','maintenance','fuel','violations','branches','settings','charges','accidents','renewals','inspections','roles','seen','invites'];
const S={vehicles:[],drivers:[],handovers:[],maintenance:[],fuel:[],violations:[],branches:[],settings:[],charges:[],accidents:[],renewals:[],inspections:[],roles:[],seen:[],invites:[]};
const loaded={};
let db=null,dl=null,readOnly=false,baseRO=false,assetsCap=null,userCap=null,ME=null;
const ROLES={branch:['مشرف فرع','يسلّم ويستلم سيارات فرعه فقط، ولا يرى غيرها'],admin:['مدير النظام','كل الصلاحيات: البيانات والإعدادات والمستخدمين والحذف'],fleet:['مدير الحركة','كل العمليات اليومية والتقارير، بدون الإعدادات والمستخدمين والحذف'],driver:['مستخدم المركبة','صفحته فقط: سياراته المسلّمة له، والفحص الأسبوعي، وتوقيع المحاضر إلكترونياً'],viewer:['مسؤول اطلاع','عرض البيانات والتقارير والتصدير فقط، بدون أي تعديل']};
const ivKey=x=>String(x&&(x.loginEmail||x.email)||'').toLowerCase();
const myInvite=()=>{const e=ME&&ME.email&&String(ME.email).toLowerCase();return e?S.invites.find(x=>ivKey(x)===e):null};
const newCode=()=>String(100000+(crypto.getRandomValues(new Uint32Array(1))[0]%900000));
const ivActive=iv=>S.seen.some(s=>String(s.email||'').toLowerCase()===ivKey(iv));
function baseRole(){if(!userCap||!ME||!ME.id)return 'admin';if(ME.isOwner)return 'admin';const r=myInvite()||S.roles.find(x=>x.id===ME.id);return r&&ROLES[r.role]?r.role:'viewer'}
function canDrive(){if(!userCap||!ME||!ME.id||ME.isOwner)return false;const r=myInvite();return !!(r&&r.role!=='driver'&&r.alsoDriver&&r.driverId)}
const MODE=()=>{try{return localStorage.getItem('fleet-mode')||''}catch(e){return ''}};
function myRole(){const b=baseRole();return b!=='driver'&&MODE()==='driver'&&canDrive()?'driver':b}
const greet=()=>{const h=new Date().getHours();return h<12?'صباح الخير':'مساء الخير'};
const myFirstName=()=>{const iv=ME&&myInvite();const n=(iv&&iv.name)||(ME&&ME.name)||'';return String(n).trim().split(/\s+/)[0]||''};
const roleLabel=iv=>{const l=(ROLES[iv.role]||ROLES.viewer)[0];return iv.role!=='driver'&&iv.alsoDriver?`${l} + ${ROLES.driver[0]}`:l};
const myDriverId=()=>{const r=ME&&(myInvite()||S.roles.find(x=>x.id===ME.id));return r&&r.driverId||null};
const isAdmin=()=>myRole()==='admin';
const UI={vq:'',vf:'all',vc:'all',vb:'all',hv:'all',vs:'all',ff:'all',rb:'all',rc:'all',rmode:'month',ryear:'',month:new Date().toISOString().slice(0,7)};
const CITIES=['الرياض','جدة','مكة المكرمة','المدينة المنورة','الدمام','الخبر','الظهران','الجبيل','الأحساء','القطيف','حفر الباطن','الطائف','تبوك','أبها','خميس مشيط','جازان','نجران','الباحة','حائل','بريدة','عنيزة','سكاكا','عرعر','ينبع','رابغ','القريات'];
const WARN_DAYS=30;

/* ---------- labels ---------- */
const STATUS={available:['متاحة','p-ok'],assigned:['مع سائق','p-info'],maintenance:['في الورشة','p-warn'],out:['خارج الخدمة','p-idle'],sold:['مُباعة','p-idle']};
const VTYPES=['سيدان','بيك أب','فان','جيب / SUV','باص','شاحنة'];
// تحويل نوع الهيكل كما يرد في تمّ إلى أنواع النظام
function guessVType(model,make){const n=nrm(model)+'|'+nrm(make);if(n==='|')return '';
  const M=[[['ميني فان','مينى فان','هاي ايس','هايس','هايإيس','hiace','فان','فانه','van','ميكروباص'],'فان'],[['باص','حافله','حافلة','كوستر','coaster','bus'],'باص'],
    [['شاحنه','شاحنة','صندوق','ثلاجه','ثلاجة','دينا','قلاب','لوري','reward','npr','fuso','كانتر','canter','truck'],'شاحنة'],
    [['بكس','بكب','بيكاب','بيك اب','غمارتين','غماره','هايلكس','hilux','ديماكس','dmax','d-max','نافارا','navara','l200','ونيت','pickup'],'بيك أب'],
    [['واجن','wagon','فيلوز','veloz','انوفا','innova','لاندكروزر','land cruiser','برادو','prado','فورتشنر','fortuner','تاهو','tahoe','باترول','patrol','suv','جيب'],'جيب / SUV'],
    [['يارس','yaris','سبارك','spark','بالينو','baleno','كامري','camry','كورولا','corolla','اكسنت','accent','النترا','إلنترا','elantra','سوناتا','sonata','صني','sunny','ريو','rio','سيراتو','cerato','دزاير','dzire','سيدان','sedan'],'سيدان']];
  for(const [ks,v] of M)if(ks.some(k=>n.includes(nrm(k))))return v;return ''}
function normVType(t){t=String(t||'').trim();if(!t||VTYPES.includes(t))return t;const n=nrm(t);
  const M=[[['ونيت','بيكاب','بيكب','غمارتين','غماره','pickup'],'بيك أب'],[['صالون','سيدان','هاتشباك','كوبيه','sedan'],'سيدان'],[['جيب','عائلي','رياضي','suv','دفعرباعي'],'جيب / SUV'],[['فان','فانه','ميكروباص','van'],'فان'],[['باص','حافله','حافلة','bus'],'باص'],[['شاحنه','شاحنة','لوري','دينا','قلاب','نقل','truck'],'شاحنة']];
  for(const [ks,v] of M)if(ks.some(k=>n.includes(nrm(k))))return v;return t}
const MKINDS={oil:'تغيير زيت وفلتر',tires:'إطارات',brakes:'فرامل',battery:'بطارية',ac:'مكيف',periodic:'صيانة دورية',repair:'إصلاح عطل',accident:'إصلاح حادث',other:'أخرى'};
const VKINDS=['ساهر – تجاوز السرعة','قطع إشارة','وقوف خاطئ','عدم ربط الحزام','استخدام الجوال','انتهاء الفحص الدوري','انتهاء الاستمارة','عدم وجود تأمين','أخرى'];
const VSTAT={unpaid:['غير مسددة','p-crit'],paid:['مسددة من الشركة','p-ok'],deducted:['مخصومة من السائق','p-acc'],objected:['معترض عليها','p-warn']};
const CHKINDS={damage:'أضرار على السيارة',accident:'حادث',fuel:'وقود غير مبرر',custody:'فقدان أو تلف عهدة',other:'أخرى'};
const CHST={pending:['بانتظار الخصم','p-warn'],deducted:['تم الخصم','p-acc'],waived:['تتحملها الشركة','p-idle']};
const ACST={reported:['مُبلَّغ عنه','p-crit'],repair:['قيد الإصلاح','p-warn'],claim:['مطالبة تأمين قائمة','p-info'],closed:['مغلق','p-ok']};
const FAULT=[0,25,50,75,100];
const RNDOC={istimara:['تجديد الاستمارة','istimaraExp'],insurance:['تجديد التأمين','insuranceExp'],fahas:['الفحص الدوري','fahasExp'],opcard:['تجديد بطاقة التشغيل','opCardExp'],other:['وثيقة أو رسوم أخرى',null]};
const CLST={none:['لم تُرفع مطالبة','p-idle'],submitted:['تم رفع المطالبة','p-info'],review:['قيد الدراسة','p-info'],approved:['مقبولة – بانتظار التحويل','p-warn'],rejected:['مرفوضة','p-crit'],paid:['تم استلام المبلغ','p-ok']};
const CLORDER=['none','submitted','review','approved','paid'];
function claimOf(a){if(a.claim&&a.claim.stage)return a.claim;
  if(+a.insurancePaid>0)return {stage:'paid',claimNo:a.claimNo||'',paidAmount:+a.insurancePaid};
  if(a.claimNo)return {stage:'submitted',claimNo:a.claimNo};return {stage:'none'}}
const clPill=c=>{const s=CLST[c.stage]||CLST.none;const amt=c.stage==='paid'?c.paidAmount:c.stage==='approved'?c.approvedAmount:c.claimAmount;return `<span class="pill ${s[1]}">${s[0]}</span>${amt&&c.stage!=='none'?`<div class="sub num">${money(amt)}</div>`:''}`};
function stepper(c){
  const st=c.stage||'none',rej=st==='rejected',idx=rej?2:CLORDER.indexOf(st);
  const S4=[['submitted','رفع المطالبة',c.submittedAt,c.claimAmount],['review','قيد الدراسة',c.reviewAt,null],rej?['rejected','رُفضت',c.rejectedAt,null]:['approved','قبول شركة التأمين',c.approvedAt,c.approvedAmount],['paid','استلام المبلغ في الحساب',c.paidAt,c.paidAmount]];
  return `<div class="steps">${S4.map(([k,l,d,amt],i)=>{const n=i+1;const done=rej?(i<2):n<=idx;const cur=!rej&&n===idx+1;const bad=rej&&k==='rejected';
    return `<div class="step${done?' done':''}${cur?' cur':''}${bad?' bad':''}"><i>${bad?'✕':done?'✓':n}</i><b>${l}</b>${d?`<small>${fmtD(d)}</small>`:''}${amt?`<em>${money(amt)}</em>`:''}</div>`}).join('')}</div>`;
}

async function makeLogo(file){

  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('تعذر قراءة الصورة'));i.src=url});
    const r=Math.min(1,360/Math.max(img.naturalWidth||360,img.naturalHeight||360));const w=Math.max(1,Math.round((img.naturalWidth||360)*r)),h=Math.max(1,Math.round((img.naturalHeight||360)*r));
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    let d=c.toDataURL('image/png');if(d.length>150000||!d.startsWith('data:image/png'))d=c.toDataURL('image/webp',0.9);if(!d.startsWith('data:image/webp')||d.length>150000)d=c.toDataURL('image/jpeg',0.85);
    if(d.length>300000)throw new Error('الصورة كبيرة جداً');return d}
  finally{URL.revokeObjectURL(url)}

function computeAlerts(){
  const out=[];
  const docs=[['istimaraExp','الاستمارة'],['insuranceExp','التأمين'],['fahasExp','الفحص الدوري'],['opCardExp','بطاقة التشغيل']];
  for(const v of S.vehicles){
    if(v.status==='out')continue;
    for(const [f,l] of docs){if(f==='opCardExp'&&!v.hasOpCard)continue;const d=daysUntil(v[f]);if(d===null)continue;
      if(d<0)out.push({sev:'crit',w:d,title:`${l} منتهية – ${plateTxt(v)}`,sub:`${vName(v)} · انتهت ${fmtD(v[f])} (منذ ${-d} يوم)`,v:v.id});
      else if(d<=WARN_DAYS)out.push({sev:'warn',w:d,title:`${l} تنتهي خلال ${d} يوم – ${plateTxt(v)}`,sub:`${vName(v)} · ${fmtD(v[f])} · ${hijri(v[f])}`,v:v.id});}
    const o=oilState(v);
    if(o.sev==='crit')out.push({sev:'crit',w:-1,title:`موعد تغيير الزيت متجاوز – ${plateTxt(v)}`,sub:`مشى ${km(o.since)} منذ آخر تغيير (المعتمد ${km(o.every)})`,v:v.id});
    else if(o.sev==='warn')out.push({sev:'warn',w:5,title:`تغيير الزيت قريب – ${plateTxt(v)}`,sub:`متبقٍ ${km(o.every-o.since)}`,v:v.id});
  }
  for(const m of S.maintenance){if(m.nextDate&&m.status!=='open'){const d=daysUntil(m.nextDate);const v=vById(m.vehicleId);
    const newer=S.maintenance.some(x=>x.vehicleId===m.vehicleId&&x.kind===m.kind&&String(x.date)>String(m.date));
    if(v&&!newer&&d!==null&&d<=7)out.push({sev:d<0?'crit':'warn',w:d,title:`صيانة مجدولة: ${MKINDS[m.kind]||m.kind} – ${plateTxt(v)}`,sub:d<0?`متأخرة ${-d} يوم`:`بعد ${d} يوم (${fmtD(m.nextDate)})`,v:v.id});}}
  for(const m of S.maintenance){if(m.status==='open'){const v=vById(m.vehicleId);const d=-daysUntil(m.date);if(v&&d>=7)out.push({sev:'warn',w:10,title:`السيارة في الورشة منذ ${d} يوم – ${plateTxt(v)}`,sub:`${MKINDS[m.kind]||''} · ${esc(m.workshop||'')}`,v:v.id});}}
  for(const d of S.drivers){if(d.active===false)continue;const x=daysUntil(d.licenseExp);if(x===null)continue;
    if(x<0)out.push({sev:'crit',w:x,title:`رخصة السائق منتهية – ${d.name}`,sub:`انتهت ${fmtD(d.licenseExp)}`,d:d.id});
    else if(x<=WARN_DAYS)out.push({sev:'warn',w:x,title:`رخصة السائق تنتهي خلال ${x} يوم – ${d.name}`,sub:fmtD(d.licenseExp),d:d.id});}
  for(const d of S.drivers){if(d.active===false||!d.hasDrvCard)continue;const x=daysUntil(d.drvCardExp);if(x===null)continue;
    if(x<0)out.push({sev:'crit',w:x,title:`بطاقة السائق منتهية – ${d.name}`,sub:`انتهت ${fmtD(d.drvCardExp)}`,d:d.id});
    else if(x<=WARN_DAYS)out.push({sev:'warn',w:x,title:`بطاقة السائق تنتهي خلال ${x} يوم – ${d.name}`,sub:fmtD(d.drvCardExp),d:d.id});}
  for(const a of S.accidents){if(a.status==='closed')continue;const d=-daysUntil(String(a.date).slice(0,10));const v=vById(a.vehicleId);
    if(d>=14)out.push({sev:'warn',w:12,title:`ملف حادث مفتوح منذ ${d} يوم – ${plateTxt(v)}`,sub:`${(ACST[a.status]||ACST.reported)[0]}${a.claimNo?' · مطالبة '+a.claimNo:''}`,go:'accidents'});}
  for(const a of S.accidents){const c=claimOf(a),v=vById(a.vehicleId);
    if(['submitted','review'].includes(c.stage)&&c.submittedAt){const d=-daysUntil(c.submittedAt);if(d>=30)out.push({sev:'warn',w:15,title:`مطالبة تأمين بلا رد منذ ${d} يوم – ${plateTxt(v)}`,sub:`${c.insurer||'شركة التأمين'}${c.claimNo?' · رقم '+c.claimNo:''} · ${money(c.claimAmount)}`,go:'accidents'})}
    if(c.stage==='approved'&&c.approvedAt){const d=-daysUntil(c.approvedAt);if(d>=14)out.push({sev:d>=30?'crit':'warn',w:14,title:`مطالبة مقبولة لم يصل مبلغها منذ ${d} يوم – ${plateTxt(v)}`,sub:`${c.insurer||'شركة التأمين'} · ${money(c.approvedAmount)}`,go:'accidents'})}}
  {const since=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
   S.inspections.filter(x=>x.issues&&String(x.date)>=since).forEach(x=>{const v=vById(x.vehicleId);if(!v)return;const later=S.maintenance.some(m=>m.vehicleId===v.id&&String(m.date)>=String(x.date));if(later)return;
     out.push({sev:'warn',w:6,title:`ملاحظة في الفحص الأسبوعي – ${plateTxt(v)}`,sub:inspIssues(x).map(([k,l])=>`${l}: ${x.items[k].note||''}`).join(' · '),v:v.id})});
   if(S.inspections.length&&myRole()!=='driver'){const miss=inspWeek().filter(x=>x.late||x.soon);if(miss.length)out.push({sev:'warn',w:25,title:`${miss.length} ${miss.length>2&&miss.length<11?'سيارات':'سيارة'} ${INSPCFG().mode==='flexible'?'لم تُفحص وتنتهي دورتها قريباً':'تأخر فحصها الأسبوعي عن موعده'}`,sub:miss.slice(0,6).map(x=>plateTxt(x.v)).join('، ')+(miss.length>6?'…':''),go:'inspect'})}}
  {const FF=fuelFlags();const since=new Date(Date.now()-30*864e5).toISOString().slice(0,10);const fl=S.fuel.filter(f=>FF[f.id]&&String(f.date)>=since);
   if(fl.length)out.push({sev:'warn',w:18,title:`${fl.length} ${fl.length>2&&fl.length<11?'تعبئات وقود مشبوهة':'تعبئة وقود مشبوهة'} خلال 30 يوماً`,sub:[...new Set(fl.map(f=>plateTxt(vById(f.vehicleId))))].slice(0,6).join('، ')+' · راجعها من صفحة الوقود',go:'fuel'})}
  const unpaid=S.violations.filter(x=>x.status==='unpaid');
  if(unpaid.length)out.push({sev:'warn',w:20,title:`${unpaid.length} مخالفة غير مسددة`,sub:`الإجمالي ${money(sum(unpaid,'amount'))}`,go:'violations'});
  out.forEach(a=>{if(a.v){const b=brOf(vById(a.v));if(b)a.sub+=` · ${b.name} – ${b.city}`}});
  return out.sort((a,b)=>(a.sev===b.sev?a.w-b.w:a.sev==='crit'?-1:1));
}

async function put(col,id,data){
  if(!db)throw new Error('offline');
  try{ if(id){await db.collection(col).doc(id).set(data);return id} const r=await db.collection(col).add(data);return r.id }
  catch(e){handleWriteErr(e);throw e}
}
async function patch(col,id,data){if(!db)throw new Error('offline');try{await db.collection(col).doc(id).update(data)}catch(e){handleWriteErr(e);throw e}}
async function del(col,id){if(!db)throw new Error('offline');try{await db.collection(col).doc(id).delete()}catch(e){handleWriteErr(e);throw e}}
function handleWriteErr(e){
  if(e&&e.code==='permission-denied'){toast('ليست لديك صلاحية لهذا الإجراء');return}
  if(e&&e.code==='invalid_argument'){readOnly=true;toast('ليست لديك صلاحية التعديل على هذا النظام – العرض فقط');render()}
  else if(e&&e.code==='quota_exceeded')toast('امتلأت سعة قاعدة البيانات – احذف سجلات قديمة');
  else toast('تعذر الحفظ، حاول مرة أخرى');
}
function setSync(ok,txt){const el=$('#sync');el.classList.toggle('off',!ok);el.querySelector('span').textContent=txt}

let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}

async function boot(){
  render();
  if(!window.claude||!window.claude.use){setSync(false,'غير متصل – افتح النظام من Claude لحفظ البيانات');return}
  try{dl=await window.claude.use('downloads')}catch(e){}
  try{assetsCap=await window.claude.use('assets')}catch(e){}
  try{
    const u=await window.claude.use('user');userCap=u;
    if(u){const c=await u.can('data.write');if(c===false)baseRO=readOnly=true;ME=await u.me()}
  }catch(e){}

    db.collection(c).onSnapshot(snap=>{const rows=snap.docs.map(d=>({id:d.id,...d.data()}));if(c==='vehicles'){ALLV=rows;applyScope()}else if(c==='handovers'){ALLH=rows;applyScope()}else S[c]=rows;ODO_IDX=null;loaded[c]=true;schedule()},

let tt;function toast(m){const r=$('#toast-root');r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(tt);tt=setTimeout(()=>r.innerHTML='',2600)}
function closeModal(){$('#modal-root').innerHTML=''}
function stampTables(root){if(!root)return;root.querySelectorAll('.tw table').forEach(t=>{if(t.closest('#pdf-sheet'))return;const hs=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());if(!hs.length)return;t.classList.add('stk');t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>td.setAttribute('data-label',hs[i]||'')))})}
function modal(title,body,foot,wide){
  $('#modal-root').innerHTML=`<div class="ov" data-ov><div class="modal${wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
  <div class="mh"><h3>${esc(title)}</h3><button class="x" data-act="close" aria-label="إغلاق">×</button></div>${body}${foot||''}</div></div>`;
  const first=$('#modal-root input:not([type=hidden]):not([type=checkbox]),#modal-root select');if(first)setTimeout(()=>first.focus(),30);
  stampTables($('#modal-root'));
}
function askYesNo(title,html,yes,no){return new Promise(res=>{const d=document.createElement('div');d.className='ov yn';d.style.zIndex=80;
  d.innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" style="max-width:440px"><div class="mh"><h3>⚠️ ${esc(title)}</h3></div><div class="mb"><p style="margin:0;line-height:1.8">${html}</p></div><div class="mf"><button class="btn primary" data-yn="1">${esc(yes)}</button><button class="btn" data-yn="0">${esc(no)}</button></div></div>`;
  d.addEventListener('click',e=>{const b=e.target.closest('[data-yn]');if(!b)return;e.stopPropagation();d.remove();res(b.dataset.yn==='1')});document.body.appendChild(d);setTimeout(()=>d.querySelector('[data-yn="1"]').focus(),30)})}
function confirmBox(text,yesLabel,onYes){

async function setLoginIds(o){

  const ek=em?await window.__loginKey('e',em):'',uk=un?await window.__loginKey('u',un):'';
  const same=(a,b)=>String(a||'').toLowerCase()===String(b||'').toLowerCase(),moved=o.prevAuth&&!same(o.prevAuth,o.auth);

  if(uk&&(uk!==o.curUK||moved))await put('logins',uk,{email:String(o.auth||'').toLowerCase(),at,companyId:PLT().company().id});

async function logoData(file){
  if(!/^image\/(png|jpeg|webp|svg\+xml|gif)$/.test(file.type))throw 'type';
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const W=img.naturalWidth||512,H=img.naturalHeight||512,r=Math.min(1,480/Math.max(W,H));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*r));c.height=Math.max(1,Math.round(H*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let d=c.toDataURL('image/png');if(d.length>350000)d=c.toDataURL('image/webp',0.9);if(d.length>350000||!d.startsWith('data:image/'))d=c.toDataURL('image/jpeg',0.85);
    return d}finally{URL.revokeObjectURL(url)}
}

function vDupGroups(){
  const all=[...S.vehicles,...SOLD],g={};
  for(const v of all){const ks=[v.vin&&String(v.vin).trim()?'v:'+String(v.vin).trim().toUpperCase():'',v.serialNo&&String(v.serialNo).trim()?'s:'+String(toLat(v.serialNo)).trim():''].filter(Boolean);for(const k of ks)(g[k]=g[k]||new Set()).add(v.id)}
  const done=new Set(),out=[];for(const ids of Object.values(g)){if(ids.size<2)continue;const key=[...ids].sort().join();if(done.has(key))continue;done.add(key);out.push([...ids].map(vById).filter(Boolean))}return out}

async function vMergeDups(){
  const groups=vDupGroups();if(!groups.length)return toast('لا توجد سيارات مكررة');
  const ts=v=>v.createdAt||v.updatedAt||'';
  const plan=groups.map(arr=>{const byRefs=[...arr].sort((a,b)=>vRefCount(b.id)-vRefCount(a.id)||String(ts(a)).localeCompare(String(ts(b))));const keep=byRefs[0];const newest=[...arr].sort((a,b)=>String(ts(b)).localeCompare(String(ts(a))))[0];return {keep,newest,drop:arr.filter(v=>v.id!==keep.id)}});
  const html=plan.map(p=>`<li>تبقى: <b>${esc(plateTxt(p.newest))}</b> — وتُدمج معها: ${[p.keep,...p.drop].filter(v=>pkey(v.plateLetters,v.plateNumbers)!==pkey(p.newest.plateLetters,p.newest.plateNumbers)).map(v=>esc(plateTxt(v))).join('، ')||'نسخة بنفس اللوحة'}</li>`).join('');
  if(!(await askYesNo('دمج السيارات المكررة',`نفس رقم الهيكل أو الرقم التسلسلي مسجل لأكثر من سيارة. بعد الدمج تبقى سيارة واحدة باللوحة الأحدث، وتنتقل لها كل السجلات (المحاضر، الوقود، الصيانة، المخالفات، الحوادث…)، وتُحفظ اللوحة القديمة في «اللوحة السابقة».<ul style="margin:10px 0 0;padding-inline-start:18px">${html}</ul>`,'نعم، ادمج','إلغاء')))return;
  const F=['plateLetters','plateNumbers','make','model','color','type','year','fuelCard','opCardNo','hasOpCard','istimaraExp','insuranceExp','fahasExp','opCardExp','insuranceStatus','fahasStatus','insuranceFrom','insPolicyNo','insType','insPremium','insDeductible','insVehValue','insProvider','branchId','tankCapacity'];
  let moved=0;
  for(const p of plan){const k=p.keep,n=p.newest;const upd={};
    if(n.id!==k.id)F.forEach(f=>{if(n[f]!=null&&String(n[f]).trim()!==''&&String(n[f])!==String(k[f]??''))upd[f]=n[f]});
    for(const d of p.drop){F.forEach(f=>{if(upd[f]==null&&(k[f]==null||String(k[f]).trim()==='')&&d[f]!=null&&String(d[f]).trim()!=='')upd[f]=d[f]});}
    const all=[k,...p.drop];upd.odometer=Math.max(...all.map(v=>+v.odometer||0));upd.lastOilKm=Math.max(...all.map(v=>+v.lastOilKm||0));
    const asg=all.find(v=>v.status==='assigned');if(asg&&k.status!=='assigned'&&k.status!=='sold'){upd.status='assigned';upd.driverId=asg.driverId}
    const fin=pkey(upd.plateLetters||k.plateLetters,upd.plateNumbers||k.plateNumbers);const hist=[];const hk=new Set([fin]);
    for(const v of all){for(const h of [...(v.plateHistory||[]),{letters:v.plateLetters,numbers:String(v.plateNumbers),until:today()}]){const x=pkey(h.letters,h.numbers);if(!hk.has(x)){hk.add(x);hist.push(h)}}}
    if(hist.length)upd.plateHistory=hist;
    const files=[...(k.files||[])];for(const d of p.drop)for(const f of d.files||[])if(!files.some(x=>x.id===f.id))files.push(f);if(files.length!==(k.files||[]).length)upd.files=files;
    upd.updatedAt=new Date().toISOString();
    for(const d of p.drop){for(const c of V_REFCOLS)for(const r of (S[c]||[]).filter(r=>r.vehicleId===d.id)){await patch(c,r.id,{vehicleId:k.id});moved++}}
    await patch('vehicles',k.id,upd);
    for(const d of p.drop)await del('vehicles',d.id);
  }
  toast(`تم دمج ${plan.length} سيارة مكررة${moved?` · نُقل ${moved} سجل`:''}`);
}

function fuelFlags(){
  if(!FEAT().fuelCheck)return {};fuelRows();const out={};const add=(f,t)=>(out[f.id]=out[f.id]||[]).push(t);
  const avg={};for(const v of S.vehicles){const k=S.fuel.filter(f=>f.vehicleId===v.id&&f._kml).map(f=>f._kml).sort((x,y)=>x-y);if(k.length>=3)avg[v.id]=k.length%2?k[k.length>>1]:(k[k.length/2-1]+k[k.length/2])/2}
  const day={};
  for(const f of S.fuel){const v=vById(f.vehicleId);if(!v||f.period)continue;const cap=+v.tankCapacity;
    if(cap>0&&+f.liters>cap*1.05)add(f,`الكمية ${nf.format(+f.liters)} لتر أكبر من سعة الخزان (${nf.format(cap)} لتر)`);
    if(f._po!=null&&+f.odometer>0&&+f.odometer<=f._po)add(f,'العداد لم يتحرك منذ التعبئة السابقة');
    const a=avg[f.vehicleId];if(a&&f._kml&&f._kml<a*.75)add(f,`الاستهلاك ${f._kml.toFixed(1)} كم/ل أقل من المعتاد للسيارة (${a.toFixed(1)}) بأكثر من 25%`);
    const k=f.vehicleId+'|'+String(f.date).slice(0,10);(day[k]=day[k]||[]).push(f)}
  for(const arr of Object.values(day))if(arr.length>1)arr.forEach(f=>add(f,`${arr.length} تعبئات لنفس السيارة في يوم واحد`));
  return out}

async function stickersPdf(ids){

    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});
    const SW=92,SH=128,gx=(210-2*SW)/3,gy=(297-2*SH)/3;
    for(let i=0;i<ids.length;i++){
      const host=document.createElement('div');host.className='qrs-host';host.dir='rtl';host.lang='ar';host.innerHTML=stickerHTML(vById(ids[i]));document.body.appendChild(host);

      const c=await window.html2canvas(host.firstElementChild,{scale:3,backgroundColor:null,logging:false});host.remove();
      const p=i%4;if(i&&!p)pdf.addPage();
      const x=gx+(p%2)*(SW+gx),y=gy+Math.floor(p/2)*(SH+gy);
      pdf.addImage(c.toDataURL('image/png'),'PNG',x,y,SW,SH);
      if(ids.length>1){pdf.setDrawColor(200);pdf.setLineDashPattern([1,1.5],0);pdf.rect(x-2,y-2,SW+4,SH+4)}
    }

    if(dl)await dl.save({filename:name,data:pdf.output('arraybuffer')});else pdf.save(name);toast('تم تنزيل الملصقات')}

}

const PF={files:[],keep:[]};
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const r=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(res=>c.toBlob(res,'image/jpeg',0.75));}
  finally{URL.revokeObjectURL(url)}
}
function photoField(existing,label){

    ...PF.files.map((f,k)=>`<span class="th"><img src="${f._u||(f._u=URL.createObjectURL(f))}" alt=""><button type="button" data-rmn="${k}" aria-label="حذف">×</button></span>`)].join('')}

function mdHtml(md){const lines=esc(md).split('\n');let o='',inT=false,inL=false;const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  for(let i=0;i<lines.length;i++){const l=lines[i];
    if(/^\s*\|/.test(l)){if(/^\s*\|[\s:|-]+\|\s*$/.test(l))continue;const c=l.trim().replace(/^\||\|$/g,'').split('|').map(x=>inl(x.trim()));if(!inT){o+='<div class="tw"><table><thead><tr>'+c.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';inT=true}else o+='<tr>'+c.map(x=>`<td>${x}</td>`).join('')+'</tr>';continue}
    if(inT){o+='</tbody></table></div>';inT=false}
    if(/^\s*[-*•]\s+/.test(l)){if(!inL){o+='<ul>';inL=true}o+=`<li>${inl(l.replace(/^\s*[-*•]\s+/,''))}</li>`;continue}
    if(inL){o+='</ul>';inL=false}
    if(/^#{1,4}\s/.test(l)){o+=`<h4>${inl(l.replace(/^#+\s/,''))}</h4>`;continue}
    if(l.trim())o+=`<p>${inl(l)}</p>`}
  if(inT)o+='</tbody></table></div>';if(inL)o+='</ul>';return o}

  S.vehicles.forEach(v=>{if(hit(plateKeys(v),v.make,v.model,v.vin,v.serialNo,v.fuelCard,v.opCardNo,v.color,v.type,brLabel(v),v.status==='assigned'?dName(v.driverId):''))add('السيارات','car','v-open',v.id,`${plateTxt(v)} — ${vName(v)} ${v.year||''}`,[STATUS[v.status||'available'][0],v.status==='assigned'?dName(v.driverId):'',brLabel(v),v.vin?'VIN '+v.vin:''].filter(Boolean).join(' · '))});

  S.maintenance.forEach(m=>{if(hit(m.workshop,m.details,MKINDS[m.kind]))add('الصيانة','wrench','m-edit',m.id,`${MKINDS[m.kind]||m.kind} – ${plateTxt(vById(m.vehicleId))}`,`${fmtD(m.date)} · ${m.workshop||''} · ${money(m.cost)}`)});
  S.fuel.forEach(f=>{if(hit(f.ref,f.station))add('الوقود','fuel','f-edit',f.id,`تعبئة ${plateTxt(vById(f.vehicleId))}${f.ref?' – '+f.ref:''}`,`${fmtD(f.date)} · ${f.liters} لتر · ${money(f.cost)} · ${f.station||''}`)});

}

function autoMap(){

    case 'u-reset':if(isAdmin())resetInvite(id);break;
    case 'h-sign':signForm(id);break;
    case 'push-on':enablePush();break;
    case 'push-test':notify([myKey()],'🔔 تجربة الإشعارات','تعمل الإشعارات على هذا الجهاز بنجاح','./#inbox','test');toast('أُرسل إشعار تجريبي');break;
    case 'msg-open':MSGUI.tid=id;MSGUI.newTo=null;openThread(id);render();break;
    case 'msg-back':MSGUI.tid=null;MSGUI.newTo=null;render();break;
    case 'msg-new':pickPerson('رسالة جديدة',k=>goChat(k));break;
    case 'msg-bc':broadcastForm();break;
    case 'msg-send':doSend(b.dataset.to);break;
    case 'msg-unref':MSGUI.ref=null;render();break;
    case 'msg-ref':openRef({col:b.dataset.col,id:b.dataset.id});break;
    case 'msg-about':msgAbout(b.dataset.col,id,b.dataset.to);break;
    case 'u-rm':if(isAdmin())confirmBox('حذف هذا المستخدم؟ يفقد صلاحية الدخول للنظام فوراً.','حذف',async()=>{const iv=S.invites.find(x=>x.id===id)||{};for(const k of [iv.eKey,iv.uKey])if(k){try{await del('logins',k)}catch(e){}}await del('invites',id)});break;
    case 'u-add':setRole(id,{role:'viewer'}).then(()=>{$('#u-res').innerHTML=''});break;
    case 'u-del':confirmBox('إلغاء صلاحية هذا المستخدم؟ يرجع «مسؤول اطلاع» فقط.','إلغاء الصلاحية',()=>del('roles',id));break;
    case 'rtype':UI.rtype=id;render();break;
    case 'ck-all':document.querySelectorAll('#frm input[type=radio][value=ok][name^="c_"]').forEach(r=>r.checked=true);break;
    case 'menu-close':$('#side').classList.remove('open');break;
    case 'backup':exportBackup();break;
    case 'aud-reload':AUD=null;render();break;
    case 'mode':{const toD=myRole()!=='driver';try{localStorage.setItem('fleet-mode',toD?'driver':'')}catch(e){}location.hash=toD?'#driver':'#dashboard';render();break}
    case 'ai-read':aiPick(id);break;
    case 'ai-dmg':aiDamage();break;
    case 'ai-dmg-note':{const n=$('#f-damages')||$('#f-notes'),st=$('#ai-dmg');if(n&&st){n.value=(n.value?n.value+'\n':'')+st.dataset.note;toast(t('أُضيف للملاحظات'))}break}
    case 'ai-sug':aiAsk(b.textContent);break;
    case 'ai-clear':UI.aih=[];render();break;
    case 'acc-email':accIdForm('email');break;
    case 'acc-user':accIdForm('user');break;
    case 'acc-pass':accPassForm();break;
    case 'dash-vf':UI.vf=b.dataset.id;location.hash='#vehicles';break;
    case 'theme':themePicker();break;
    case 'theme-set':try{localStorage.setItem('fleet-theme',b.dataset.th)}catch(e){}applyTheme();themePicker();break;
    case 'fs-set':try{localStorage.setItem('fleet-fs',b.dataset.fs)}catch(e){}applyTheme();themePicker();break;
    case 'logout':confirmBox('تسجيل الخروج من النظام؟','خروج',()=>window.__fbSignOut&&window.__fbSignOut());break;
    case 'copy-link':{const i=$('#inv-link');if(i){i.select();try{navigator.clipboard.writeText(i.value)}catch(err){}toast('تم نسخ الرابط')}}break;
    case 'import-data':if(isAdmin())importForm();break;
    case 'go':location.hash=id;break;
    case 'vf':UI.vf=id;render();break;
    case 'vs':UI.vs=id;render();break;
    case 'ff':UI.ff=id;render();break;
    case 'v-open':openVehicle(id);break;
    case 'v-new':if(W()&&vLimitOk())vehicleForm();break;
    case 'v-edit':if(W())vehicleForm(id);break;
    case 'v-del':{const v=vById(id);if(v.status==='assigned'){toast('استلم السيارة من السائق قبل حذفها');break}
      confirmBox(`حذف السيارة ${esc(plateTxt(v))} نهائياً؟ تبقى سجلاتها السابقة لكن بدون بيانات السيارة.`,'حذف السيارة',()=>del('vehicles',id).then(()=>toast('تم الحذف')));break}
    case 'd-new':if(W())driverForm();break;
    case 'd-edit':driverForm(id);break;
    case 'd-del':{if(S.vehicles.some(v=>v.status==='assigned'&&v.driverId===id)){toast('السائق لديه عهدة – استلمها أولاً');break}
      confirmBox(`حذف السائق ${esc(dName(id))}؟ يُفضّل إيقافه بدلاً من حذفه للاحتفاظ بسجله.`,'حذف',()=>del('drivers',id).then(()=>toast('تم الحذف')));break}
    case 'ho-out':if(W())handOutForm(id);break;
    case 'ho-in':if(W())handInForm(id);break;
    case 'ho-view':viewHand(id);break;
    case 'ho-pdf':downloadPdf(id);break;
    case 'imp':if(W()&&(id!=='vehicles'||vLimitOk()))openImport(id);break;
    case 'imp-tpl':importTemplate();break;
    case 'imp-go':if(W())runImport();break;
    case 'd-open':driverProfile(id);break;
    case 'mgmt-pdf':mgmtPdf();break;
    case 'rep-pdf':reportPdf();break;
    case 'i-new':if(W())inspForm(id,b.dataset.mode);break;
    case 'insp-cfg':if(W()&&isAdmin())inspCfgForm();break;
    case 'i-view':viewInsp(id);break;
    case 'i-del':confirmBox('حذف سجل الفحص؟','حذف',()=>del('inspections',id).then(()=>toast('تم الحذف')));break;
    case 'r-new':if(W())renewForm(null,id,b.dataset.doc);break;
    case 'r-edit':if(W())renewForm(id);break;
    case 'r-del':{const r=S.renewals.find(x=>x.id===id);confirmBox('حذف عملية التجديد؟ لا يتغير تاريخ انتهاء الوثيقة في بيانات السيارة.','حذف',async()=>{await del('renewals',id);setTimeout(()=>openVehicle(r.vehicleId),60)});break}
    case 'a-new':if(W())accForm(null,id);break;
    case 'a-edit':accForm(id);break;
    case 'a-del':confirmBox('حذف سجل الحادث؟ تُحذف معه المطالبة المرتبطة على السائق إن لم تُخصم بعد.','حذف',async()=>{const c=S.charges.find(x=>x.accidentId===id&&x.status==='pending');if(c)await del('charges',c.id);await del('accidents',id);toast('تم الحذف')});break;
    case 'ch-new':if(W())chargeForm(null,{driverId:id});break;
    case 'ch-edit':if(W())chargeForm(id);break;
    case 'ch-dmg':{if(!W())break;const h=S.handovers.find(x=>x.id===id);const ex=S.charges.find(c=>c.handoverId===id);
      if(ex){chargeForm(ex.id);break}chargeForm(null,{driverId:h.custodyDriverId||h.driverId,vehicleId:h.vehicleId,kind:'damage',notes:h.damages,handoverId:h.id,date:String(h.at).slice(0,10)});break}
    case 'ch-del':{const c=S.charges.find(x=>x.id===id);confirmBox('حذف المطالبة؟','حذف',async()=>{await del('charges',id);setTimeout(()=>driverProfile(c.driverId),50)});break}
    case 'v-ded':case 'v-waive':if(W())patch('violations',id,{status:a==='v-ded'?'deducted':'paid'}).then(()=>{toast('تم التحديث');setTimeout(()=>driverProfile(b.dataset.d),80)}).catch(()=>{});break;
    case 'c-ded':case 'c-waive':if(W())patch('charges',id,{status:a==='c-ded'?'deducted':'waived',settledAt:today()}).then(()=>{toast('تم التحديث');setTimeout(()=>driverProfile(b.dataset.d),80)}).catch(()=>{});break;
    case 'd-csv':exportCSV('driver:'+id);break;
    case 'b-new':if(W())branchForm();break;
    case 'b-edit':if(W())branchForm(id);break;
    case 'b-del':{const n=S.vehicles.filter(v=>v.branchId===id).length;if(n){toast(`انقل سيارات الفرع (${n}) لفرع آخر قبل حذفه`);break}
      confirmBox(`حذف فرع ${esc(bById(id)?.name||'')}؟`,'حذف الفرع',()=>del('branches',id).then(()=>toast('تم حذف الفرع')));break}
    case 'co-edit':if(W())companyForm();break;
    case 'vbr':UI.vb=id;UI.vc='all';UI.vf='all';UI.vq='';location.hash='vehicles';render();break;
    case 'm-new':if(W())maintForm(null,id);break;
    case 'm-edit':maintForm(id);break;
    case 'm-close':{const m=S.maintenance.find(x=>x.id===id);const v=vById(m.vehicleId);
      confirmBox(`تسجيل خروج ${esc(plateTxt(v))} من الورشة وإعادتها متاحة؟`,'نعم، خرجت',async()=>{await patch('maintenance',id,{status:'done',closedAt:today()});if(v&&v.status==='maintenance'&&!S.maintenance.some(x=>x.id!==id&&x.vehicleId===v.id&&x.status==='open'))await patch('vehicles',v.id,{status:'available'});toast('عادت السيارة متاحة')});break}
    case 'm-del':confirmBox('حذف سجل الصيانة؟','حذف',()=>del('maintenance',id));break;
    case 'f-new':if(W())fuelForm();break;
    case 'f-edit':fuelForm(id);break;
    case 'vd-add':if(W())vDocForm(id);break;
    case 'vd-del':if(W())vDocDel(id,+b.dataset.k);break;
    case 'qr':stickerPreview(id);break;
    case 'qr-pdf':stickersPdf([id]);break;
    case 'qr-all':stickersPdf(S.vehicles.filter(v=>v.status!=='out').sort((a,b)=>plateTxt(a).localeCompare(plateTxt(b),'ar')).map(v=>v.id));break;
    case 'rem-on':if(isAdmin())remEnable();break;
    case 'rem-off':if(isAdmin())remSet('enabled',false);break;
    case 'rem-test':remTest(id);break;
    case 'lang':I18N.set(id);render();break;
    case 'hr-dl':hrDownload();break;
    case 'hr-set':if(isAdmin()&&W())hrForm();break;
    case 'hr-send':if(isAdmin()&&W())hrSendNow();break;
    case 'my-nid':if(isAdmin())myNidForm();break;
    case 'v-sell':if(isAdmin()&&W())sellForm(id);break;
    case 'v-merge':if(isAdmin()&&W())vMergeDups().catch(e=>toast('تعذر الدمج: '+(e.message||e)));break;
    case 'v-unsell':if(isAdmin()&&W())unsell(id);break;
    case 'f-del':confirmBox('حذف سجل التعبئة؟','حذف',()=>del('fuel',id));break;
    case 'x-new':if(W())violForm();break;
    case 'x-edit':violForm(id);break;
    case 'x-del':confirmBox('حذف المخالفة؟','حذف',()=>del('violations',id));break;
    case 'csv':exportCSV(id);break;
    case 'clear-demo':confirmBox('حذف كل البيانات التوضيحية (السيارات والسائقين والسجلات المكتوب عليها «مثال»)؟ بياناتك التي أدخلتها بنفسك لا تتأثر.','حذف الأمثلة',async()=>{
      for(const c of COLS)for(const x of RAW(c).filter(y=>y.demo))await del(c,x.id);toast('تم حذف الأمثلة – النظام جاهز لبياناتك')});break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const l=document.querySelector('.lb');if(l){l.remove();return}closeModal()}if(e.key==='Enter'&&e.target.matches('.alert'))e.target.click()});
document.addEventListener('input',e=>{if(e.target.id==='vq'){UI.vq=e.target.value;renderVList()}});
document.addEventListener('change',e=>{if(e.target.id&&e.target.id.startsWith('sc-')){const k=e.target.dataset.k;UI[k]=e.target.value;if(k==='vc')UI.vb='all';if(k==='rc')UI.rb='all';render();return}
  if(e.target.id==='hv'){UI.hv=e.target.value;render()}if(e.target.id==='rmode'){UI.rmode=e.target.value;render();return}if(e.target.id==='ryear'){UI.ryear=e.target.value;render();return}if(e.target.id==='rmon'){UI.month=e.target.value||today().slice(0,7);render()}});
window.__appReady.then(boot);
</script>

</body>
</html>
